<span>Meeting<span class="ms-accent">Scheduled</span></span></a><span class="private-label">Persönliche Demo</span></header><main class="gate-wrap"><div><section class="gate-card"><div class="lock-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></div><h1>Ihre persönliche<br>Demo wartet.</h1><p>Bitte geben Sie das Passwort ein, um die Präsentation anzusehen.</p><form id="unlock-form"><label for="password">Passwort</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Passwort eingeben" required autofocus><button type="submit" id="unlock-button">Demo öffnen <span aria-hidden="true">→</span></button><div id="unlock-error" class="error" role="alert" aria-live="polite"></div></form></section><p class="gate-credit">Für Sie vorbereitet von Eyal Taieb · MeetingScheduled</p></div></main><script>
(()=>{'use strict';const form=document.getElementById('unlock-form'),input=document.getElementById('password'),button=document.getElementById('unlock-button'),error=document.getElementById('unlock-error');const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let urls=[];window.addEventListener('pagehide',()=>urls.forEach(u=>URL.revokeObjectURL(u)));form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';button.disabled=true;button.textContent='Demo wird geöffnet …';let authenticated=false;try{const response=await fetch('media/protected-presentation-v5.json');if(!response.ok)throw Error('network');const box=await response.json();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(box.salt),iterations:box.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(box.iv)},key,bytes(box.ciphertext));authenticated=true;const data=JSON.parse(new TextDecoder().decode(decoded));button.textContent='Video wird vorbereitet …';const videoResponse=await fetch('media/'+data.videoFile);if(!videoResponse.ok)throw Error('network');const videoBuffer=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(data.videoIv)},key,await videoResponse.arrayBuffer());const videoUrl=URL.createObjectURL(new Blob([videoBuffer],{type:'video/mp4'})),captionUrl=URL.createObjectURL(new Blob([data.captions],{type:'text/vtt'}));urls=[videoUrl,captionUrl];input.value='';document.title=data.title;document.head.querySelectorAll('style').forEach(s=>s.remove());const style=document.createElement('style');style.textContent=data.css;document.head.append(style);document.body.innerHTML=data.body.replaceAll('__VIDEO__',videoUrl).replaceAll('__POSTER__',data.poster).replaceAll('__CAPTIONS__',captionUrl);const transcript=document.getElementById('transcript');for(const item of data.transcript){const row=document.createElement('div');row.className='line';const who=document.createElement('strong');who.textContent=item.role==='agent'?'Karl':'Kunde';const content=document.createElement('span');content.textContent=item.content;row.append(who,content);transcript.append(row)}document.querySelector('[data-lock]').addEventListener('click',()=>location.reload());window.scrollTo(0,0)}catch(e){error.textContent=e.name==='OperationError'&&!authenticated?'Das Passwort stimmt nicht. Bitte versuchen Sie es erneut.':'Die Demo konnte nicht geladen werden. Bitte versuchen Sie es erneut.';button.disabled=false;button.innerHTML='Demo öffnen <span aria-hidden="true">→</span>';input.focus();input.select()}})})();
