<style>
:root{--ink:#1c1c1e;--muted:#6c6c72;--line:#deebe6;--bg:#f7faf8;--card:#fff;--rose:#087c78;--rose2:#0a513c;--rose-t:#ebf5f0;--rose-b:#b9dfd0;--shadow:0 1px 2px rgba(22,35,43,.05),0 8px 24px rgba(22,35,43,.07)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;width:100%}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.mark{width:32px;height:32px;border-radius:9px;background:var(--rose-t);color:var(--rose);display:grid;place-items:center}
main{flex:1;display:grid;place-items:center;padding:48px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);max-width:620px;width:100%;padding:44px 36px;text-align:center}
.icon{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;background:var(--rose-t);border:1px solid var(--rose-b);color:var(--rose);display:grid;place-items:center}
.icon svg{width:30px;height:30px}
h1{font-size:34px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin-bottom:14px}
h1 span{color:var(--rose)}
p{font-size:19px;color:#3a3a40}
p+p{margin-top:8px}
@media (max-width:520px){.card{padding:34px 22px}h1{font-size:27px}p{font-size:17px}}
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7.2 6 10.5A6 6 0 0 1 6 13.5C6 10.2 9 7 12 3z"/></svg></span><span>fleckweg · Wiederbuchung</span></div>
</div></div>

<main>
  <div class="card">
    <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <h1>Diese Demo ist <span>nicht mehr verfügbar</span></h1>
    <p>Der Zeitraum zum Ansehen dieser Demo ist abgelaufen.</p>
    <p>Bitte wenden Sie sich an den Administrator, um den Zugang wieder freizuschalten.</p>
  </div>
</main>

<script defer src="https://reach.meeting-scheduled.com/demo-analytics/visit.js" data-demo="fleckweg"></script>

</html>
