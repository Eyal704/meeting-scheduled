<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>BioCert · Protected workspace</title><style>body{font:16px Arial,sans-serif;background:#edf3f0;color:#203c3d;max-width:560px;margin:15vh auto;padding:30px;line-height:1.8}a{color:#19746e}</style></head><body><h1>BioCert reporting workspace</h1><p>The workspace is password protected.</p><p><a href="https://www.meeting-scheduled.com/biocert/?example=complete">Open the protected workspace →</a></p><script>if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>new URL(r.scope).pathname.startsWith('/biocert/')).map(r=>r.unregister())));if('caches'in window)caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('biocert-workspace-static-')).map(k=>caches.delete(k))));if(location.hostname!=='www.meeting-scheduled.com'&&location.hostname!=='meeting-scheduled.com')location.replace('https://www.meeting-scheduled.com/biocert/?example=complete');</script></body></html>
