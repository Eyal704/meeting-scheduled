<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#153b3d"><title>BioCert | Reporting workspace</title><link rel="icon" href="assets/biocert-logo.png"><style>*{box-sizing:border-box}body{margin:0;background:#e7edec;font:13px Arial,sans-serif;color:#213a3c}.preview-bar{height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #dce4e3;gap:14px}.preview-brand{display:flex;align-items:center;gap:16px}.preview-brand img{width:128px;height:auto}.preview-brand span{border-left:1px solid #dce4e3;padding-left:16px;color:#748482;font-size:11px}.switch{background:#eef3f1;padding:4px;display:flex;border-radius:7px;gap:4px}.switch button{font:600 12px Arial,sans-serif;border:0;padding:9px 17px;border-radius:5px;color:#627774;background:none;cursor:pointer}.switch button[aria-pressed=true]{background:#fff;color:#176e69;box-shadow:0 1px 4px #223c331c}.external{font-size:11px;color:#5a706c;text-decoration:none}.stage{height:calc(100dvh - 64px);display:flex;justify-content:center;align-items:stretch;overflow:hidden}.frame{width:100%;height:100%;position:relative;transition:width .2s}iframe{width:100%;height:100%;border:0;background:#f4f7f6;display:block}.stage.mobile{padding:18px 0}.stage.mobile .frame{width:390px;max-width:100%;border:7px solid #203937;border-radius:32px;overflow:hidden;box-shadow:0 12px 45px #213c382e}.stage.mobile iframe{border-radius:23px}.preview-bar button:focus-visible,.external:focus-visible{outline:3px solid #5faaa0;outline-offset:2px}@media(max-width:650px){.preview-bar{height:58px;padding:0 10px;gap:8px}.preview-brand img{width:105px}.preview-brand span,.external{display:none}.switch button{padding:8px 11px;font-size:11px}.stage{height:calc(100dvh - 58px)}.stage.mobile{padding:0}.stage.mobile .frame{border:0;border-radius:0;box-shadow:none;width:100%}.stage.mobile iframe{border-radius:0}.stage.desktop .frame{width:1100px;min-width:1100px;transform-origin:top center;transform:scale(var(--desktop-scale));height:calc(100% / var(--desktop-scale))}}@media(prefers-reduced-motion:reduce){.frame{transition:none}}</style></head><body><header class="preview-bar"><div class="preview-brand"><img src="assets/biocert-logo.png" alt="BioCert Laboratory"><span>Reporting workspace</span></div><div class="switch" role="group" aria-label="Device preview"><button id="desktop" aria-pressed="true">▰ &nbsp; Desktop</button><button id="mobile" aria-pressed="false">▯ &nbsp; Mobile</button></div><a class="external" href="workspace.html" target="_blank" rel="noopener">Open workspace ↗</a></header><main class="stage desktop" id="stage"><div class="frame"><iframe src="workspace.html" title="BioCert reporting workspace" allow="web-share"></iframe></div></main><script>const stage=document.getElementById('stage');function setDevice(device){stage.className='stage '+device;for(const id of ['mobile','desktop'])document.getElementById(id).setAttribute('aria-pressed',String(id===device));resize();document.querySelector('iframe').contentWindow?.scrollTo(0,0)}function resize(){document.documentElement.style.setProperty('--desktop-scale',String(Math.min(1,innerWidth/1100)))}document.getElementById('desktop').onclick=()=>setDevice('desktop');document.getElementById('mobile').onclick=()=>setDevice('mobile');setDevice(innerWidth<650?'mobile':'desktop');addEventListener('resize',resize);</script></body></html>
