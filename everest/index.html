<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>אוורסט · היסטוריית מכונות</title>
<meta name="description" content="מערכת שירות לאוורסט מכונות: כרטיס לכל מכונה עם כל הטיפולים, קריאה שמגיעה לטכנאי בטלפון, דוח שירות עם חתימת הלקוח, ומעקב מעבדה.">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:url" content="https://www.meeting-scheduled.com/everest/">
<meta property="og:title" content="אוורסט מכונות · היסטוריה לכל מכונה">
<meta property="og:description" content="מקלידים מספר מכונה ורואים כל מה שטופל בה. הקריאה מגיעה לטכנאי בטלפון, והלקוח חותם על דוח השירות בסוף הביקור.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202e;--muted:#5f6b7a;--faint:#9aa4b1;--line:#e3e8ef;--bg:#f5f7fa;--card:#fff;
  --navy:#12305a;--navy2:#0c2342;--navy-t:#eaf0f8;--navy-b:#c9d6e8;
  --or:#f07b12;--or2:#b85a00;--or-t:#fff3e6;--or-b:#f8cf9f;
  --green:#22784a;--green-t:#e6f3ec;--red:#c0392b;--red-t:#fbeae8;--blue:#2f5ea8;--blue-t:#e9f0fb;
  --violet:#6b4fa0;--violet-t:#f1ecf8;--wa:#1f9d55;
  --shadow:0 1px 2px rgba(16,32,52,.05),0 8px 24px rgba(16,32,52,.07);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:13.5px}.b{font-weight:700}.ltr{direction:ltr;unicode-bidi:isolate}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--navy-b)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.or{background:var(--or);border-color:var(--or);color:#fff}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.c-install{background:var(--navy-t);color:var(--navy)}
.c-periodic{background:var(--green-t);color:var(--green)}
.c-fault{background:var(--red-t);color:var(--red)}
.c-lab{background:var(--violet-t);color:var(--violet)}
.c-warn{background:var(--or-t);color:var(--or2)}
.c-ok{background:var(--green-t);color:var(--green)}
.c-gray{background:#eef1f5;color:var(--muted)}
.c-blue{background:var(--blue-t);color:var(--blue)}
/* top */
.top{background:var(--navy2);color:#fff;position:sticky;top:0;z-index:30}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .wm{font-weight:800;letter-spacing:.14em;font-size:18px;direction:ltr}
.brand .sub{font-size:12.5px;opacity:.75;border-inline-start:1px solid rgba(255,255,255,.25);padding-inline-start:10px}
.tabs{display:flex;gap:4px;margin-inline-start:auto;overflow:auto}
.tab{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;color:rgba(255,255,255,.75);white-space:nowrap;text-decoration:none}
.tab:hover{color:#fff}
.tab.on{background:rgba(255,255,255,.14);color:#fff}
.tab .n{background:var(--or);color:#fff;border-radius:999px;font-size:11.5px;padding:0 7px;margin-inline-start:5px}
main{padding:20px 0 60px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h1{font-size:21px;font-weight:800;margin-inline-end:auto}
/* search */
.search{display:flex;align-items:center;gap:10px;padding:14px 16px;margin-bottom:14px}
.search input{flex:1;border:0;outline:0;font-size:19px;background:transparent;min-width:0}
.search svg{flex:none;color:var(--faint)}
.hint{font-size:13px;color:var(--muted);margin:-6px 2px 14px}
.hint button{border:0;background:none;color:var(--navy);font-weight:700;padding:0 4px;text-decoration:underline}
/* table */
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:700;background:#fafbfd}
tr.click{cursor:pointer}tr.click:hover td{background:var(--navy-t)}
tr.attn td:first-child{box-shadow:inset -3px 0 0 var(--or)}
.tbl{overflow-x:auto}
.sn{font-weight:800;direction:ltr;unicode-bidi:isolate;font-size:14px;letter-spacing:.02em}
@media(max-width:760px){.hide-s{display:none}th,td{padding:9px 8px;font-size:14px}td .small{font-size:12.5px}}
.sn{white-space:nowrap}
/* machine card */
.mhead{padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px}
.mhead h2{font-size:22px;font-weight:800}
.mhead .acts{align-self:start}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.specs>div{background:#fff;padding:10px 14px}
.specs .k{font-size:12px;color:var(--muted);font-weight:700}
.specs .v{font-weight:700;font-size:14.5px}
@media(max-width:860px){.specs{grid-template-columns:repeat(2,minmax(0,1fr))}.mhead{grid-template-columns:1fr}}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;margin-top:12px;font-weight:600;font-size:14.5px}
.banner.warn{background:var(--or-t);border:1px solid var(--or-b);color:var(--or2)}
.banner.ok{background:var(--green-t);border:1px solid #cbe6d6;color:var(--green)}
.banner.info{background:var(--navy-t);border:1px solid var(--navy-b);color:var(--navy)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;margin-top:14px;align-items:start}
@media(max-width:960px){.cols{grid-template-columns:1fr}}
.side .sec+.sec{margin-top:14px}
.sec{padding:14px 16px}
.sec h3{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--navy);color:#fff}
/* timeline */
.tl{position:relative;padding-inline-start:22px}
.tl::before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.ev::before{content:"";position:absolute;inset-inline-start:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--navy-b)}
.ev.t-fault::before{border-color:var(--red)}.ev.t-periodic::before{border-color:var(--green)}.ev.t-lab::before{border-color:var(--violet)}.ev.t-install::before{border-color:var(--navy)}
.ev .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .h .d{font-weight:800}
.ev .h .who{color:var(--muted);font-size:13.5px;margin-inline-start:auto}
.ev .ttl{font-weight:700;margin-top:4px}
.ev .body{font-size:14.2px;margin-top:4px;color:#2a3442}
.ev .body b{color:var(--ink)}
.ev .parts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.part-chip{background:#f1f4f8;border-radius:7px;padding:1px 8px;font-size:12.5px}
.ev .foot{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ev .foot a{font-weight:700}
.kv{display:grid;grid-template-columns:105px 1fr;gap:5px 10px;font-size:14.2px}
.kv>div:nth-child(odd){color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.mini .row:last-child{border:0}
/* calls */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.board{grid-template-columns:1fr}}
.col{padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0;background:#fbfcfe}
.col-h{display:flex;align-items:center;gap:8px}
.col-h h3{font-size:15.5px;font-weight:800}
.col-h .cnt{margin-inline-start:auto;color:var(--muted);font-weight:700;font-size:13.5px}
.call{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff;cursor:pointer;text-align:start;width:100%;display:block}
.call:hover{border-color:var(--navy-b);box-shadow:var(--shadow)}
.call.urgent{border-inline-start:4px solid var(--or)}
.call .c1{font-weight:800;font-size:14.5px}
.call .c2{font-size:13.5px;color:var(--muted)}
.call .c3{font-size:13.5px;margin-top:3px}
.call .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.empty{font-size:13px;color:var(--faint);text-align:center;padding:8px}
/* forms */
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,34,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:#fff;border-radius:16px;width:min(680px,100%);max-height:100%;overflow:auto;padding:20px}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal .mh h2{font-size:19px;font-weight:800;margin-inline-end:auto}
.x{border:0;background:none;font-size:24px;line-height:1;color:var(--muted)}
.found{background:var(--navy-t);border:1px solid var(--navy-b);border-radius:11px;padding:10px 12px;font-size:14px;margin-top:8px}
/* tech phone */
.tv{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.tv{grid-template-columns:1fr}}
.tv-list .t{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid transparent;cursor:pointer;width:100%;background:none;text-align:start}
.tv-list .t.on{background:#fff;border-color:var(--line);box-shadow:var(--shadow)}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy-t);color:var(--navy);display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.phone-frame{max-width:410px;margin:0 auto;border:10px solid #111a26;border-radius:40px;background:#111a26;box-shadow:var(--shadow)}
.screen{background:var(--bg);border-radius:30px;overflow:hidden;min-height:720px;max-height:820px;overflow-y:auto}
.ph-h{background:var(--navy);color:#fff;padding:16px 16px 14px}
.ph-h .sm{font-size:13px;opacity:.8}
.ph-body{padding:12px}
.ph-body .sec{padding:13px 14px;margin-bottom:10px}
.ph-body .sec h4{font-size:15.5px;font-weight:800;margin-bottom:8px}
.pjob{display:block;width:100%;text-align:start;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer}
.pjob .tm{font-weight:800;font-size:15px}
.pjob.done{opacity:.6}
.prev{background:var(--or-t);border:1px solid var(--or-b);border-radius:13px;padding:12px 13px;margin-bottom:10px}
.prev h4{color:var(--or2)}
.prev .pi{font-size:14px;padding:7px 0;border-top:1px dashed var(--or-b)}
.prev .pi:first-of-type{border-top:0;padding-top:0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer}
.chk:last-child{border:0}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--green)}
.choice{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-weight:600;font-size:14px}
.choice.on{background:var(--navy);border-color:var(--navy);color:#fff}
.choices{display:flex;gap:6px;flex-wrap:wrap}
.part{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.2px}
.part:last-child{border:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700}
.qty b{min-width:18px;text-align:center}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-slot{position:relative;aspect-ratio:1;border:1.5px dashed var(--navy-b);border-radius:11px;display:grid;place-items:center;background:#fff;overflow:hidden;cursor:pointer;margin:0;color:var(--muted);font-size:12.5px;text-align:center}
.ph-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sig{width:100%;height:150px;border:1.5px dashed var(--navy-b);border-radius:11px;background:#fff;touch-action:none;display:block}
.bigbtn{width:100%;justify-content:center;padding:14px;font-size:16.5px}
/* lab */
.stages{display:flex;gap:4px;flex-wrap:wrap}
.stg{font-size:12px;padding:2px 8px;border-radius:999px;background:#eef1f5;color:var(--faint);font-weight:700}
.stg.done{background:var(--violet-t);color:var(--violet)}
.stg.cur{background:var(--violet);color:#fff}
/* report */
.report{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}
.rep-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--navy);padding-bottom:14px;margin-bottom:16px;gap:14px}
.rep-h .wm{font-weight:800;letter-spacing:.14em;font-size:22px;color:var(--navy);direction:ltr}
.rep-sec{margin-top:16px}
.rep-sec h3{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.rep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;font-size:14px}
.rep-grid .k{color:var(--muted);font-size:12.5px;font-weight:700}
@media(max-width:640px){.rep-grid{grid-template-columns:1fr 1fr}.report{padding:16px}}
@media print{.noprint{display:none!important}body{background:#fff}.report{border:0;padding:0}.top{display:none}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:80;font-weight:600;box-shadow:var(--shadow)}
.gate{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--navy2)}
.gate .card{padding:28px;width:min(360px,100%);text-align:center}
</style>
</head>

      <div class="card sec"><h4>מה דווח</h4>${esc(k.desc)}</div>
      <div class="prev"><h4>מה טופל במכונה בפעם הקודמת</h4>
        ${H.slice(0,3).map(h=>`<div class="pi"><b>${fdShort(h.date)}</b> · ${TYPE_NAME[h.type]} · ${esc(tech(h.techId).name)}<br>${h.type==='periodic'?esc(h.done):`<b>${esc(h.title)}</b>`}${h.done&&h.type!=='periodic'?`<div class="small" style="color:#5b3a12">${esc(h.done)}</div>`:''}${h.parts?.length?`<div class="small muted">חלפים: ${h.parts.map(p=>esc(p.n)).join(', ')}</div>`:''}</div>`).join('')}
        <a class="small b" href="#m/${m.sn}" style="color:var(--or2)">כל ההיסטוריה (${H.length})</a></div>
      ${done?`<div class="card sec" style="text-align:center"><div style="font-size:34px;color:var(--green)">✓</div><h4>הדוח נחתם ונשמר בכרטיס המכונה</h4><a class="btn pri" href="#r/${k.histId}">לדוח השירות</a></div>`:
      k.status!=='work'?`<button class="btn pri bigbtn" onclick="jobStart('${id}')">הגעתי, מתחיל עבודה</button>`:`
      <div class="card sec"><h4>1. סוג הביקור</h4><div class="choices">${[['fault','תקלה'],['periodic','טיפול תקופתי'],['install','התקנה / הדרכה']].map(([v,t])=>`<button class="choice ${TD.kind===v?'on':''}" onclick="TD.kind='${v}';jobSave();viewJobRe('${id}')">${t}</button>`).join('')}</div></div>
      ${TD.kind==='periodic'?`<div class="card sec"><h4>2. רשימת בדיקות</h4>${CHECK[m.type].map((t,i)=>`<label class="chk"><input type="checkbox" ${TD.checks[i]?'checked':''} onchange="TD.checks[${i}]=this.checked;jobSave()"><span>${t}</span></label>`).join('')}</div>`:
      `<div class="card sec"><h4>2. מה נמצא</h4><textarea oninput="TD.found=this.value;jobSave()" placeholder="מה הבעיה שנמצאה">${esc(TD.found)}</textarea></div>`}
      <div class="card sec"><h4>3. מה בוצע</h4><textarea oninput="TD.done=this.value;jobSave()" placeholder="מה תוקן, מה כויל, מה כדאי לבדוק בפעם הבאה">${esc(TD.done)}</textarea></div>
      <div class="card sec"><h4>4. חלפים שהוחלפו</h4>${PARTS[m.type].map(([n,pn],i)=>`<div class="part"><span>${n}</span><span class="qty"><button onclick="jq('${id}',${i},-1)">−</button><b>${TD.parts[i]||0}</b><button onclick="jq('${id}',${i},1)">+</button></span></div>`).join('')}</div>
      <div class="card sec"><h4>5. תמונות</h4><div class="photos">${[0,1,2].map(i=>`<label class="ph-slot">${TD.photos[i]?`<img src="${TD.photos[i]}" alt="">`:'<span>📷<br>צילום</span>'}<input type="file" accept="image/*" capture="environment" onchange="jPhoto('${id}',${i},this)"></label>`).join('')}</div></div>
      <div class="card sec"><h4>6. שעות עבודה</h4><input type="number" min="0" step="0.5" value="${esc(TD.hours)}" oninput="TD.hours=this.value;jobSave()" placeholder="למשל 2.5"></div>
      <div class="card sec"><h4>7. חתימת הלקוח</h4><label>שם החותם</label><input type="text" value="${esc(TD.signer)}" oninput="TD.signer=this.value;jobSave()">
        <canvas class="sig" id="sig" style="margin-top:8px"></canvas><div style="display:flex;justify-content:space-between;margin-top:4px"><span class="small muted">חותמים עם האצבע</span><button class="btn sm" onclick="TD.sig=null;jobSave();initSig()">ניקוי</button></div></div>
      <button class="btn go bigbtn" onclick="jobSubmit('${id}')">סיום, הפקת דוח שירות</button>`}
      <p style="text-align:center;margin:16px 0 4px"><a class="small" href="#tech/${k.techId||''}">חזרה לקריאות שלי</a></p>
    </div>`;
  if(standalone){$('#app').innerHTML=`<div style="max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg)">${html}</div>`}
  else{viewTech(k.techId);$('#screen').innerHTML=html;$('#screen').scrollTop=0}
  initSig();
}
function viewJobRe(id){const sc=$('#screen');const top=sc?sc.scrollTop:window.scrollY;viewJob(id,isPhone());if(sc&&$('#screen'))$('#screen').scrollTop=top;else window.scrollTo(0,top)}
function isPhone(){return window.innerWidth<700}
function jobSave(){const k=call(TD.id);k.draft=TD;save()}
function jobStart(id){const k=call(id);k.status='work';k.started=new Date().toISOString();save();viewJobRe(id)}
function jq(id,i,d){TD.parts[i]=Math.max(0,(TD.parts[i]||0)+d);jobSave();viewJobRe(id)}
function jPhoto(id,i,input){const f=input.files[0];if(!f)return;const img=new Image();const u=URL.createObjectURL(f);
  img.onload=()=>{const sc=Math.min(1,700/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);TD.photos[i]=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(u);jobSave();viewJobRe(id)};
  img.onerror=()=>toast('לא ניתן לפתוח את התמונה');img.src=u}
function initSig(){
  const cv=$('#sig');if(!cv)return;const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#12305a';
  if(TD?.sig){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=TD.sig}
  let on=false;const P=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{on=true;cv.setPointerCapture(e.pointerId);const[a,b]=P(e);x.beginPath();x.moveTo(a,b)};
  cv.onpointermove=e=>{if(!on)return;const[a,b]=P(e);x.lineTo(a,b);x.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{if(!on)return;on=false;TD.sig=cv.toDataURL('image/png');jobSave()};
}
function jobSubmit(id){
  const k=call(id),m=mach(k.sn);
  if(TD.kind!=='periodic'&&!TD.found.trim()){toast('כותבים מה נמצא');return}
  if(!TD.done.trim()&&TD.kind!=='periodic'){toast('כותבים מה בוצע');return}
  if(!TD.sig){toast('חסרה חתימת הלקוח');return}
  const no=nextNo();
  const checks=TD.kind==='periodic'?CHECK[m.type].map((_,i)=>!!TD.checks[i]):null;
  const h={id:'h'+no,no,sn:k.sn,date:TODAY(),type:TD.kind==='install'?'install':TD.kind,techId:k.techId,
    title:TD.kind==='periodic'?'טיפול תקופתי':TD.kind==='install'?'התקנה / הדרכה':(TD.found.trim().split('\n')[0].slice(0,80)),
    found:TD.kind==='periodic'?'':TD.found.trim(),done:TD.done.trim()||(checks?CHECK[m.type].filter((_,i)=>checks[i]).join(' · ')+'.':''),checklist:checks,
    parts:PARTS[m.type].map(([n,pn],i)=>({n,pn,q:TD.parts[i]||0})).filter(p=>p.q),photos:TD.photos.filter(Boolean),hours:+TD.hours||null,signedBy:TD.signer.trim(),sig:TD.sig,status:'ok',callNo:k.no,fresh:true};
  S.history.push(h);k.status='done';k.closedAt=new Date().toISOString();k.histId=h.id;delete k.draft;save();TD=null;
  toast('הדוח נשמר בכרטיס המכונה');location.hash='r/'+h.id;
}

/* ================= report ================= */
function viewReport(id){
  const h=S.history.find(x=>x.id===id);if(!h)return notFound();
  const m=mach(h.sn),c=cust(m.custId);
  const msg=`שלום ${c.contact}, מצורף דוח השירות מהביקור היום (${m.model} ${m.sn}):\n${link('r/'+h.id)}\nאוורסט מכונות`;
  shell('machines',`<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px">
      <a class="btn wa" target="_blank" rel="noopener" href="${waLink(msg)}">שליחה ללקוח בוואטסאפ</a><a class="btn" href="mailto:?subject=${encodeURIComponent('דוח שירות #'+h.no+' · '+m.sn)}&body=${encodeURIComponent(msg)}">שליחה במייל</a><button class="btn" onclick="window.print()">הדפסה / PDF</button><a class="btn" href="#m/${m.sn}">לכרטיס המכונה</a></div>
    <div class="report">
      <div class="rep-h"><div><div style="display:flex;align-items:center;gap:8px"><svg width="34" height="27" viewBox="0 0 38 30"><path d="M2 28 L15 6 L21 15 L25 10 L36 28 Z" fill="#12305a"/><path d="M15 6 L19.5 13.6 L17 12.4 L15 14.2 L12.6 12.3 L10.6 13.4 Z" fill="#f07b12"/></svg><span class="wm">EVEREST</span></div>
        <div class="small muted">אוורסט יבוא מכונות בע״מ · בולטימור 21, עכו</div></div>
        <div style="text-align:left"><div style="font-size:20px;font-weight:800">דוח שירות #${h.no}</div><div class="small muted">${fd(h.date)}</div>${h.callNo?`<div class="small muted">קריאה #${h.callNo}</div>`:''}</div></div>
      <div class="rep-grid">
        <div><div class="k">לקוח</div>${esc(c.name)}</div><div><div class="k">כתובת</div>${esc(c.city)}</div><div><div class="k">איש קשר</div>${esc(c.contact)}</div>
        <div><div class="k">מכונה</div>${esc(m.model)}</div><div><div class="k">מספר סידורי</div><span class="ltr">${m.sn}</span></div><div><div class="k">שעות מכונה</div>${m.hours.toLocaleString('he-IL')}</div>
        ${m.source?`<div><div class="k">מקור לייזר</div><span class="ltr">${esc(m.source.model)} · ${m.source.sn}</span></div><div><div class="k">ראש</div><span class="ltr">${esc(m.head.model)}</span></div>`:''}
        <div><div class="k">סוג ביקור</div>${TYPE_NAME[h.type]}</div><div><div class="k">טכנאי</div>${esc(tech(h.techId).name)}</div><div><div class="k">שעות עבודה</div>${h.hours||'—'}</div>
        <div><div class="k">אחריות</div>${warrantyEnd(m)>=h.date?'באחריות':'מחוץ לאחריות'}</div>
      </div>
      ${h.found?`<div class="rep-sec"><h3>ממצא</h3><p>${esc(h.found)}</p></div>`:''}
      ${h.checklist?`<div class="rep-sec"><h3>רשימת בדיקות</h3>${CHECK[m.type].map((t,i)=>`<div style="font-size:14px">${h.checklist[i]?'<b style="color:var(--green)">✓</b>':'<b style="color:var(--faint)">–</b>'} ${t}</div>`).join('')}</div>`:''}
      ${h.done?`<div class="rep-sec"><h3>מה בוצע</h3><p>${esc(h.done)}</p></div>`:''}
      <div class="rep-sec"><h3>חלפים</h3>${h.parts?.length?`<table><thead><tr><th>פריט</th><th>מק״ט</th><th>כמות</th></tr></thead><tbody>${h.parts.map(p=>`<tr><td>${esc(p.n)}</td><td class="ltr">${esc(p.pn||'')}</td><td>${p.q}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">לא הוחלפו חלפים</p>'}</div>
      ${h.photos?.length?`<div class="rep-sec"><h3>תמונות</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${h.photos.map(p=>`<img src="${p}" style="width:160px;height:120px;object-fit:cover;border-radius:8px">`).join('')}</div></div>`:''}
      <div class="rep-sec" style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div><h3>חתימת הלקוח</h3>${h.sig?`<img src="${h.sig}" style="max-width:100%;height:90px;object-fit:contain">`:'<div style="height:60px;border-bottom:1px solid var(--line)"></div>'}<div class="small">${esc(h.signedBy||'')}</div></div>
        <div><h3>טכנאי</h3><div style="height:60px"></div><div class="small">${esc(tech(h.techId).name)}</div></div></div>
    </div>`);
  window.scrollTo(0,0);
}

/* ================= lab ================= */
function viewLab(){
  const L=[...S.lab].sort((a,b)=>(a.stage===5)-(b.stage===5)||b.received.localeCompare(a.received));
  shell('lab',`<div class="bar"><h1>מעבדת מקורות וראשי לייזר</h1><button class="btn or" onclick="openLabNew()">+ קבלת פריט</button></div>
  <div class="card tbl"><table><thead><tr><th>#</th><th>פריט</th><th>לקוח · מכונה</th><th class="hide-s">תקלה</th><th>שלב</th><th></th></tr></thead><tbody>
  ${L.map(l=>{const m=mach(l.sn),c=cust(m.custId),days=daysBetween(l.received,TODAY());return`<tr>
    <td class="b">${l.no}</td><td><div class="b">${l.item}</div><div class="small muted ltr" style="text-align:right">${esc(l.model)} · ${l.itemSn}</div></td>
    <td><div>${esc(c.name)}</div><a class="small sn" href="#m/${m.sn}">${m.sn}</a></td>
    <td class="hide-s small">${esc(l.fault)}</td>
    <td><div class="stages">${LAB_STAGES.map((s,i)=>`<span class="stg ${i<l.stage?'done':i===l.stage?'cur':''}" title="${s}">${i===l.stage?s:i+1}</span>`).join('')}</div><div class="small muted" style="margin-top:3px">התקבל ${fdShort(l.received)} · ${days} ימים במעבדה</div></td>
    <td>${l.stage<5?`<button class="btn sm" onclick="labNext('${l.id}')">${LAB_STAGES[l.stage+1]} ←</button>`:'<span class="chip c-ok">הוחזר</span>'}</td></tr>`}).join('')}</tbody></table></div>
  <p class="small muted" style="margin-top:10px">כשפריט מוחזר ללקוח, התיקון נרשם אוטומטית בהיסטוריה של המכונה.</p>`);
}
function labNext(id){
  const l=S.lab.find(x=>x.id===id);
  if(l.stage===4){
    const res=prompt('מה תוקן? (יירשם בכרטיס המכונה)','הוחלף מודול משאבה, בדיקת הספק 100% במשך 4 שעות.');if(res===null)return;
    const no=nextNo();S.history.push({id:'h'+no,no,sn:l.sn,date:TODAY(),type:'lab',techId:'alex',title:`מעבדה: ${l.item} ${l.model}`,found:l.fault,done:res,parts:[],hours:null,status:'ok'});
    toast('התיקון נרשם בכרטיס המכונה');
  }
  l.stage=Math.min(5,l.stage+1);save();viewLab();
}
function openLabNew(){
  modal(`<div class="mh"><h2>קבלת פריט למעבדה</h2><button class="x" onclick="closeModal()">×</button></div>
    <div class="grid2"><div><label>מספר סידורי של המכונה</label><input type="text" id="l-sn" list="sns2" class="ltr" style="text-align:right" autocomplete="off"><datalist id="sns2">${S.machines.filter(m=>m.source).map(m=>`<option value="${m.sn}">${esc(cust(m.custId).name)}</option>`).join('')}</datalist></div>
    <div><label>פריט</label><select id="l-item"><option>מקור לייזר</option><option>ראש לייזר</option></select></div></div>
    <div style="margin-top:12px"><label>תקלה מדווחת</label><textarea id="l-fault"></textarea></div>
    <div style="margin-top:14px"><button class="btn or" onclick="saveLab()">קליטה</button></div>`);
}
function saveLab(){const v=$('#l-sn').value.trim().toUpperCase();const m=S.machines.find(x=>x.sn.toUpperCase()===v&&x.source);if(!m){toast('לא נמצאה מכונת לייזר עם המספר הזה');return}
  const item=$('#l-item').value;const no=Math.max(...S.lab.map(l=>l.no))+1;
  S.lab.push({id:'l'+no,no,sn:m.sn,item,model:item==='מקור לייזר'?m.source.model:m.head.model,itemSn:item==='מקור לייזר'?m.source.sn:m.head.sn,fault:$('#l-fault').value.trim()||'—',stage:0,received:TODAY()});save();closeModal();viewLab()}

/* ================= modal / routing / gate ================= */
function modal(html){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="modal">${html}</div>`;o.onclick=e=>{if(e.target===o)closeModal()};document.body.appendChild(o)}
function closeModal(){$('#ov')?.remove()}
function notFound(){shell('',`<div class="card sec">לא נמצא. <a href="#machines">חזרה</a></div>`)}
function unlocked(){try{return localStorage.getItem(LOCK)==='1'||window._ok}catch(e){return!!window._ok}}
function renderGate(){$('#app').innerHTML=`<div class="gate"><div class="card"><div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:6px"><svg width="34" height="27" viewBox="0 0 38 30"><path d="M2 28 L15 6 L21 15 L25 10 L36 28 Z" fill="#12305a"/><path d="M15 6 L19.5 13.6 L17 12.4 L15 14.2 L12.6 12.3 L10.6 13.4 Z" fill="#f07b12"/></svg><b style="letter-spacing:.14em;font-size:20px;color:var(--navy)">EVEREST</b></div>
  <p class="muted" style="margin-bottom:14px">מערכת שירות</p><form onsubmit="return tryUnlock(event)"><input type="password" id="gpw" placeholder="סיסמה" style="text-align:center"><button class="btn pri" style="width:100%;justify-content:center;margin-top:10px">כניסה</button><p id="gerr" class="small" style="color:var(--red);min-height:20px;margin-top:6px"></p></form></div></div>`;setTimeout(()=>$('#gpw')?.focus(),50)}
function tryUnlock(e){e.preventDefault();if($('#gpw').value.trim()==='1'){try{localStorage.setItem(LOCK,'1')}catch(_){}window._ok=true;route()}else{$('#gerr').textContent='סיסמה שגויה'}return false}
function route(){
  closeModal();
  if(!unlocked())return renderGate();
  const h=decodeURIComponent(location.hash.slice(1))||'machines';const[a,b]=h.split('/');
  if(a!=='job')TD=TD&&a==='job'?TD:null;
  if(a==='machines')return viewMachines();
  if(a==='m')return viewMachine(b);
  if(a==='calls')return viewCalls();
  if(a==='tech')return viewTech(b);
  if(a==='job')return viewJob(b,isPhone());
  if(a==='r')return viewReport(b);
  if(a==='lab')return viewLab();
  viewMachines();
}
S=load()||seed();save();
window.addEventListener('hashchange',()=>{VIEW.hf=location.hash.startsWith('#m/')?VIEW.hf:'all';route()});
route();
</script>
</body>
