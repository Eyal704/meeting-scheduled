<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b2540"><title>שחר — הדגמת מערכת השירות</title><link rel="icon" href="./brand/icon.jpg"><style>
@font-face{font-family:Assistant;src:url('./fonts/Assistant-Regular.ttf')}@font-face{font-family:Assistant;src:url('./fonts/Assistant-Bold.ttf');font-weight:700}*{box-sizing:border-box}body{margin:0;font-family:Assistant,Arial,sans-serif;background:#e7edf3;color:#102e4b;height:100dvh;display:flex;flex-direction:column}.demo-toolbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 24px;background:#0b2540;color:white;box-shadow:0 2px 12px #071b3522;z-index:10}.identity{display:flex;align-items:center;gap:12px}.identity img{width:68px;max-height:40px;object-fit:contain;background:white;padding:5px;border-radius:8px}.identity strong{font-size:19px;display:block}.identity small{display:block;color:#b9cedf;font-size:13px}.controls{display:flex;align-items:center;gap:8px}button{font:700 15px Assistant,Arial;cursor:pointer;border:1px solid #ffffff38;background:#ffffff0d;color:white;border-radius:9px;min-height:42px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px}button:hover{background:#ffffff20}button:focus-visible{outline:3px solid #49ccff;outline-offset:3px}#viewport-toggle[aria-pressed=true]{background:#d3f3ff;color:#073d62;border-color:#d3f3ff}button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:0;transition:padding .2s}.frame-wrap{width:100%;height:100%;background:white;overflow:hidden;transition:width .2s,border-radius .2s;position:relative}iframe{border:0;width:100%;height:100%;display:block;background:white}.mobile .stage{padding:14px 12px}.mobile .frame-wrap{width:390px;max-width:100%;border:6px solid #18364f;border-radius:30px;box-shadow:0 12px 42px #102a4330}.hint{display:none;font-size:13px;color:#c0d1df}.mobile .hint{display:block}dialog{font-family:inherit;border:0;border-radius:16px;padding:26px;width:min(420px,90vw);color:#17334b;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#08243a66}dialog h2{margin:0 0 10px}dialog p{line-height:1.6}dialog .actions{display:flex;gap:8px}dialog button{background:#0b4973;color:white;border-color:#0b4973}dialog button[value=cancel]{background:white;color:#17334b;border-color:#ccd7e0}@media(max-width:800px){.demo-toolbar{padding:9px 12px;gap:7px;flex-wrap:wrap}.identity{gap:8px}.identity img{width:48px}.identity strong{font-size:16px}.identity small{font-size:11px}.controls{width:100%;justify-content:space-between}.controls button{min-height:38px;padding:6px 11px;font-size:14px}.hint{display:none!important}.mobile .stage{padding:0}.mobile .frame-wrap{width:100%;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){.stage,.frame-wrap{transition:none}}
</style></head><body><header class="demo-toolbar"><div class="identity"><img src="./brand/logo.png" alt="שחר"><div><strong>מערכת שחר — הדגמה פתוחה</strong><small>נתונים בדויים בלבד • השינויים נשמרים בדפדפן הזה</small></div></div><div class="controls"><span class="hint">אותה מערכת, בתצוגת טלפון</span><button id="viewport-toggle" type="button" aria-pressed="false" aria-controls="demo-frame"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg><span>תצוגת מובייל</span></button><button id="reset" type="button">איפוס ההדגמה</button></div></header><main class="stage"><div class="frame-wrap"><iframe id="demo-frame" src="./app.html" title="מערכת שחר — מנהלת וטכנאי"></iframe></div></main><dialog id="reset-dialog"><form method="dialog"><h2>להתחיל את ההדגמה מחדש?</h2><p>השינויים שביצעת בהדגמה בדפדפן הזה יימחקו, ונתוני הדוגמה המקוריים יחזרו.</p><div class="actions"><button value="confirm">איפוס נתוני ההדגמה</button><button value="cancel">ביטול</button></div></form></dialog><script>
const toggle=document.getElementById('viewport-toggle'),frame=document.getElementById('demo-frame'),dialog=document.getElementById('reset-dialog');
toggle.addEventListener('click',()=>{const mobile=document.body.classList.toggle('mobile');toggle.setAttribute('aria-pressed',String(mobile));toggle.querySelector('span').textContent=mobile?'תצוגת מחשב':'תצוגת מובייל';});
document.getElementById('reset').addEventListener('click',()=>dialog.showModal());dialog.addEventListener('close',()=>{if(dialog.returnValue==='confirm'){localStorage.removeItem('shahar-public-demo-data-v1');localStorage.removeItem('shahar-public-demo-preview-v1');frame.src='./app.html';}});
</script></body></html>
