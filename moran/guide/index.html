<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>סרטון הסבר | מורן מהנדסים</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#11233e;font-family:Arial,sans-serif;line-height:1.6}main{max-width:820px;margin:0 auto;padding:36px 24px}header{display:flex;gap:14px;align-items:center;margin-bottom:28px}header img{width:66px;height:58px;object-fit:contain}header strong{font-size:20px}header p{margin:0;color:#64748b;font-size:14px}h1{font-size:30px;line-height:1.3;margin:0 0 8px}p{margin:0 0 22px;color:#566781}video{width:auto;max-width:100%;height:76vh;aspect-ratio:900/1920;object-fit:contain;margin:0 auto;display:block;border-radius:14px;background:#07152c;box-shadow:0 12px 45px #19305217}footer{font-size:13px;color:#6d7b90;margin-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#435f7b;text-underline-offset:4px}a:focus-visible{outline:3px solid #86a3ba;outline-offset:4px}@media(max-width:600px){main{padding:22px 14px}h1{font-size:25px}header{margin-bottom:22px}p{font-size:15px}video{border-radius:8px}}#demo-gate{min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f3f6fa}#demo-gate[hidden]{display:none}#demo-gate form{width:100%;max-width:380px;padding:32px;background:white;border:1px solid #dce3ec;border-radius:18px;box-shadow:0 16px 48px #24364b0d}#demo-gate img{display:block;width:160px;height:auto;margin:0 auto 24px}#demo-gate h1{font-size:26px;margin:0 0 10px}#demo-gate p{color:#596b80;margin:0 0 24px}#demo-gate label{display:block;margin-bottom:8px}#demo-password{box-sizing:border-box;width:100%;min-height:48px;padding:10px 12px;border:1px solid #aab8ca;border-radius:8px;font:inherit;font-size:16px}#demo-password:focus-visible,#demo-enter:focus-visible{outline:3px solid #7496bc;outline-offset:3px}#demo-enter{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:8px;background:#435f7b;color:white;font:inherit;cursor:pointer}#demo-gate #demo-error{min-height:24px;margin:12px 0 0;color:#a82d36;font-size:14px}</style></head><body><div id="demo-gate"><form id="demo-login"><img src="../assets/moran-logo.png" alt="מורן מהנדסים"><h1>כניסה לסרטון ההסבר</h1><p>הזינו את הסיסמה שקיבלתם כדי להמשיך.</p><label for="demo-password">סיסמה</label><input id="demo-password" name="password" type="password" autocomplete="current-password" required autofocus aria-describedby="demo-error"><button id="demo-enter" type="submit">כניסה</button><p id="demo-error" role="alert" aria-live="polite"></p><noscript>יש להפעיל JavaScript בדפדפן כדי להיכנס.</noscript></form></div><template id="guide-content"><main><header><img src="../assets/moran-mark.png" alt="מורן מהנדסים"><div><strong>מורן מהנדסים</strong><p>מהשטח לדוח</p></div></header><h1>כך עובדים עם הדמו מהשטח</h1><p>כך הבודק מסמן בדיקות, מזין מדידות ומתעד ליקויים מהטלפון — ומעביר את הנתונים לדוח.</p><video controls playsinline preload="metadata" poster="poster.png?v=sharp-3" aria-label="סרטון הדרכה בעברית לשימוש בדמו"><source src="moran-walkthrough.mp4?v=sharp-yarden-3" type="video/mp4">הדפדפן אינו תומך בניגון הסרטון. אפשר להוריד אותו בקישור למטה.</video><footer><span>דקה ו־37 שניות · הסבר בעברית · נתוני הדגמה</span><a href="moran-walkthrough.mp4?v=sharp-yarden-3" download>הורדת הסרטון</a></footer></main></template><script>
// Basic client-side gate, same password as the /moran/ demo; static files remain publicly accessible.
(()=>{const form=document.getElementById('demo-login'),password=document.getElementById('demo-password'),error=document.getElementById('demo-error');
password.addEventListener('input',()=>{password.removeAttribute('aria-invalid');error.textContent=''});
form.addEventListener('submit',e=>{e.preventDefault();
if(password.value!=='א'){error.textContent='הסיסמה שגויה. נסו שוב.';password.setAttribute('aria-invalid','true');password.focus();password.select();return}
password.value='';document.getElementById('demo-gate').hidden=true;
document.body.appendChild(document.getElementById('guide-content').content.cloneNode(true));
const h=document.querySelector('main h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}})})();
</script></body></html>
