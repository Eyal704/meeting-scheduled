<head>

<style>
:root{
  --ink:#1c1c1e;--muted:#6c6c72;--faint:#a0a0a8;--line:#ece4e6;--bg:#fdf9fa;--card:#fff;
  --rose:#c9536e;--rose2:#a84059;--rose-t:#fdf2f4;--rose-b:#e9cfd6;
  --teal:#2f6f63;--teal-t:#e6f2ef;--red:#c2413b;--red-t:#fbeceb;--amber:#b7791f;--amber-t:#fbf3e4;
  --green:#2f7d4f;--green-t:#e8f4ec;--blue:#3f5fa8;--blue-t:#ebf0fa;--wa:#1f9d55;
  --shadow:0 1px 2px rgba(22,35,43,.05),0 8px 24px rgba(22,35,43,.07);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rose2)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:13.5px}.b{font-weight:700}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--rose-b)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st-scheduled{background:var(--blue-t);color:var(--blue)}
.st-sent{background:var(--amber-t);color:var(--amber)}
.st-done_tech{background:var(--rose-t);color:var(--rose2)}
.st-approved{background:var(--teal-t);color:var(--teal)}
.st-closed{background:var(--green-t);color:var(--green)}
.urg{background:var(--red-t);color:var(--red)}
/* top bar */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16.5px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--rose-t);color:var(--rose);display:grid;place-items:center;font-weight:800}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-inline-start:auto}
.tab{border:0;background:none;padding:7px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--rose-t);color:var(--rose2)}
main{padding:20px 0 60px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar h1{font-size:22px;font-weight:800;margin-inline-end:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
/* board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}
.col{padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px}
.col-h .dot{width:10px;height:10px;border-radius:50%}
.col-h h3{font-size:16px;font-weight:800}
.tech-h{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.job{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;cursor:pointer;text-align:start;width:100%;display:block}
.job:hover{border-color:var(--rose-b);box-shadow:var(--shadow)}
.job .t{font-weight:800;font-size:14px;direction:ltr;text-align:right}
.job .c{font-weight:600;font-size:14px;margin-top:1px}
.job .d{font-size:12.5px;color:var(--muted)}
.job .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.gap{font-size:11.5px;color:var(--faint);text-align:center}
.empty{font-size:13px;color:var(--faint);text-align:center;padding:6px}
/* table */
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:700}
tr.click{cursor:pointer}tr.click:hover td{background:var(--rose-t)}
.tbl{overflow-x:auto}
/* forms */
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.suggest{background:var(--teal-t);border:1px solid #cfe6e0;border-radius:12px;padding:10px 12px;font-size:14.5px}
/* modal / drawer */
.ov{position:fixed;inset:0;background:rgba(20,20,24,.38);z-index:50;display:flex;justify-content:flex-start}
.drawer{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:18px;box-shadow:var(--shadow)}
.modal-c{margin:auto;background:#fff;border-radius:18px;width:min(720px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;padding:20px}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.sec{padding:14px;margin-top:12px}
.sec h4{font-size:15px;font-weight:800;margin-bottom:8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14.5px}
.kv div:nth-child(odd){color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px}
.stp{display:flex;gap:8px;align-items:center;font-size:14px}
.stp i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.stp.ok i{background:var(--green);border-color:var(--green)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* whatsapp bubble */
.wa-box{background:#e9e2d8;border-radius:14px;padding:12px}
.wa-chat{border-radius:14px;overflow:hidden;border:1px solid #d1d7db;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.wa-top{background:#008069;color:#fff;display:flex;align-items:center;gap:10px;padding:9px 12px}
.wa-av{width:38px;height:38px;border-radius:50%;background:#e9edef;color:#008069;display:grid;place-items:center;font-weight:800;flex:none}
.wa-top b{font-size:15.5px;display:block;line-height:1.25}.wa-top small{font-size:12px;opacity:.85}
.wa-body{background-color:#efeae2;background-image:radial-gradient(rgba(84,101,111,.07) 1.2px,transparent 1.2px);background-size:16px 16px;padding:14px 12px 16px}
.wa-day{display:table;margin:0 auto 10px;background:#fff;color:#54656f;font-size:12px;border-radius:7px;padding:3px 10px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.wa-bub{background:#d9fdd3;border-radius:0 8px 8px 8px;padding:7px 9px 5px;font-size:14.2px;line-height:1.5;color:#111b21;white-space:pre-wrap;word-break:break-word;max-width:94%;margin-inline-start:auto;position:relative;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.wa-bub::after{content:"";position:absolute;top:0;left:-8px;border-width:0 8px 9px 0;border-style:solid;border-color:transparent #d9fdd3 transparent transparent}
.wa-bub a{color:#027eb5;text-decoration:none;word-break:break-all}
.wa-meta{display:block;text-align:left;font-size:11px;color:#667781;margin-top:2px;direction:ltr}
.wa-meta i{font-style:normal;color:#53bdeb;letter-spacing:-3px;margin-left:3px}
.bub{background:#dcf8c6;border-radius:10px 10px 2px 10px;padding:9px 11px;font-size:14px;white-space:pre-wrap;line-height:1.5;max-width:100%;box-shadow:0 1px 1px rgba(0,0,0,.08);word-break:break-word}
.bub.in{background:#fff;border-radius:10px 10px 10px 2px}
.bub-meta{font-size:11px;color:#6b7c6b;text-align:left;margin-top:3px}
/* phone views */
.phone{max-width:430px;margin:0 auto;padding:16px}
.ph-h{background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px}
.ph-h .sm{opacity:.75;font-size:13px}
.big-btns{display:grid;gap:8px}
.choice{border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-weight:800;font-size:16px;text-align:center}
.choice.on{border-color:var(--rose);background:var(--rose-t);color:var(--rose2)}
.part{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.step-n{display:inline-flex;align-items:center;gap:6px}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:18px}
.qty b{min-width:18px;text-align:center}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph-slot{border:2px dashed var(--rose-b);border-radius:14px;aspect-ratio:4/3;display:grid;place-items:center;text-align:center;color:var(--rose2);font-weight:700;font-size:14px;cursor:pointer;overflow:hidden;position:relative;background:#fff}
.ph-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ph-slot input{display:none}
.stars{display:flex;gap:6px;justify-content:center;direction:ltr}
.stars button{border:0;background:none;font-size:40px;line-height:1;color:#ddd}
.stars button.on{color:#f2b01e}
/* leaderboard */
.lb-row{display:grid;grid-template-columns:34px 1fr repeat(4,minmax(64px,auto));gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14.5px}
.lb-row.h{font-size:12.5px;color:var(--muted);font-weight:700}
.rank{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800}
.lead .rank{background:#f2b01e;color:#fff}
.bonus{background:var(--green-t);color:var(--green)}
.meter{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--green)}
@media(max-width:640px){.lb-row{grid-template-columns:30px 1fr 60px 60px}.lb-row .hide-s{display:none}}
/* report */
.report{max-width:800px;margin:0 auto;background:#fff;padding:34px;border:1px solid var(--line);border-radius:6px}
.rep-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--rose);padding-bottom:14px;margin-bottom:16px;gap:12px}
.rep-h h1{font-size:22px;font-weight:800}
.rep-tbl td{border:1px solid var(--line);padding:7px 10px}
.rep-tbl td:first-child{background:var(--bg);font-weight:700;width:150px}
.rep-ph{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.rep-ph figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rep-ph img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.rep-ph figcaption{padding:5px 8px;font-size:13px;font-weight:700;background:var(--bg)}
.noimg{aspect-ratio:4/3;display:grid;place-items:center;color:var(--faint);font-size:13px}
@media print{.noprint{display:none!important}body{background:#fff}.report{border:0;padding:0}}
.foot{color:var(--faint);font-size:12.5px;text-align:center;padding:24px 0}
.tv-grid{display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
.tv-phone{border:10px solid #1c1c1e;border-radius:38px;background:#1c1c1e;box-shadow:var(--shadow)}
.tv-screen{background:var(--bg);border-radius:28px;padding:14px 12px 22px;min-height:560px;max-height:720px;overflow:auto}
@media(max-width:860px){.tv-grid{grid-template-columns:1fr}.tv-phone{order:-1;max-width:400px;width:100%;margin:0 auto}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:80;font-weight:600;box-shadow:var(--shadow)}
.note{background:var(--amber-t);color:#7a5413;border-radius:12px;padding:10px 12px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ data ============ */
const KEY='dudi-field-v1';
const CATS=[
  {id:'sewer',name:'ביוב',color:'#7a5c3e'},
  {id:'press',name:'הגברת לחץ',color:'#3f5fa8'},
  {id:'tank',name:'חיטוי מאגרי מים',color:'#2f6f63'},
  {id:'fire',name:'משאבות כיבוי אש',color:'#c2413b'},
  {id:'repair',name:'תיקונים',color:'#b7791f'},
];
const TECHS=[
  {id:'sami',name:'סמי',cat:'sewer'},{id:'moti',name:'מוטי',cat:'sewer'},
  {id:'fadi',name:'פאדי',cat:'press'},{id:'avi',name:'אבי',cat:'tank'},
  {id:'yossi',name:'יוסי',cat:'fire'},{id:'nir',name:'ניר',cat:'repair'},
];
const TYPES=[
  {id:'s1',cat:'sewer',name:'פתיחת סתימה בלחץ',base:60},
  {id:'s2',cat:'sewer',name:'החלפת משאבת ביוב',base:120},
  {id:'s3',cat:'sewer',name:'צילום קו ביוב',base:60},
  {id:'s4',cat:'sewer',name:'שאיבת הצפה',base:90},
  {id:'p1',cat:'press',name:'טיפול תקופתי במשאבות הגברת לחץ',base:75},
  {id:'p2',cat:'press',name:'תקלת לחץ מים בבניין',base:90},
  {id:'p3',cat:'press',name:'החלפת מיכל לחץ',base:120},
  {id:'t1',cat:'tank',name:'ניקוי וחיטוי מאגר מים',base:240},
  {id:'t2',cat:'tank',name:'דיגום מים אחרי חיטוי',base:45},
  {id:'f1',cat:'fire',name:'הפעלה מאולצת למשאבות הידרנטים',base:45},
  {id:'f2',cat:'fire',name:'טיפול תקופתי בחדר משאבות כיבוי',base:90},
  {id:'r1',cat:'repair',name:'תיקון צנרת',base:120},
  {id:'r2',cat:'repair',name:'תקלה בלוח פיקוד',base:90},
];
const PARTS={
  sewer:['משאבה טבולה','מצוף','שסתום אל-חוזר','צינור גמיש','כבל חשמל'],
  press:['מיכל לחץ','מפסק לחץ','מד לחץ','שסתום אל-חוזר','אטם מכני'],
  tank:['חומר חיטוי','מסנן','אטם מכסה','ערכת דיגום'],
  fire:['מד לחץ','שסתום','מצבר למנוע דיזל','רצועה','אטם מכני'],
  repair:['צינור','מחבר','ברז','מגען','ממסר','נתיך'],
};
const STATUS={scheduled:'משובץ',sent:'נשלח לטכנאי',done_tech:'הטכנאי סיים',approved:'הלקוח אישר',closed:'נסגר'};
const ORDER=['scheduled','sent','done_tech','approved','closed'];
const SOURCES=['טלפון','וואטסאפ','מייל','SMS'];
const RESULTS={ok:'תקין, הטיפול הושלם',follow:'נדרש המשך טיפול',fault:'לא תקין, נדרש תיקון נוסף'};
const CUSTOMERS=[
  ['ועד בית הרצל 18','רמת גן','דנה'],['ועד בית ז׳בוטינסקי 44','בני ברק','משה'],['אחוזת השרון ניהול נכסים','פתח תקווה','רונית'],
  ['ועד בית ביאליק 7','גבעתיים','אורי'],['מלון ים התיכון','תל אביב','שי'],['ועד בית הנרקיס 3','אור יהודה','ליאת'],
  ['מרכז מסחרי הגליל','חולון','איתי'],['ועד בית ההגנה 21','בת ים','מרים'],['מפעל אלומיניום השקד','ראשון לציון','גיל'],
  ['ועד בית אחד העם 90','הרצליה','נועה'],['ניהול מגדלי הים','תל אביב','עמית'],['ועד בית הדקל 12','קריית אונו','יעל'],
  ['ועד בית סוקולוב 5','רמת השרון','אבי'],['חניון העירייה','גבעת שמואל','סיגל'],['ועד בית הגפן 9','יהוד','רפי'],
];
const DAY_START=7*60+30, DAY_END=18*60;
let S;

/* ============ utils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ds(d)};
const TODAY=()=>ds(new Date());
const toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const dayName=s=>{const d=new Date(s+'T12:00');const t=TODAY();if(s===t)return'היום';if(s===addDays(t,1))return'מחר';if(s===addDays(t,-1))return'אתמול';return d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric'})};
const fullDate=s=>new Date(s+'T12:00').toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'});
const ts=iso=>new Date(iso).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
const tech=id=>S.techs.find(t=>t.id===id)||{name:'—'};
const ACT=()=>S.techs.filter(t=>!t.removed);
const cat=id=>CATS.find(c=>c.id===id)||{name:'—',color:'#999'};
const type=id=>S.types.find(t=>t.id===id)||{name:'—',base:60};
const job=id=>S.jobs.find(j=>j.id===id);
const link=h=>location.origin+location.pathname+'#'+h;
const waLink=txt=>'https://wa.me/?text='+encodeURIComponent(txt);
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}

/* learned duration: average of the last 10 real visits once there are 3 */
function estDur(typeId){
  const t=type(typeId);const s=(t.samples||[]).slice(-10);
  if(s.length<3)return{min:t.base,n:s.length,learned:false};
  const avg=s.reduce((a,b)=>a+b,0)/s.length;
  return{min:Math.max(15,Math.round(avg/15)*15),n:s.length,learned:true};
}

/* ============ seed ============ */
function seed(){
  const r=rng(20261117);const pick=a=>a[Math.floor(r()*a.length)];
  const types=TYPES.map(t=>({...t,samples:[]}));
  const st={techs:TECHS.map(t=>({...t})),types,jobs:[],log:[],seq:1000,
    settings:{gap:30,company:'קבוצת דודי מערכות ומשאבות מים',google:'',bonus:1000,bonusTarget:30,fbDelay:30}};
  S=st;
  const t0=TODAY();
  // history: last 16 days, closed with feedback
  for(let d=-16;d<=-1;d++){
    const date=addDays(t0,d);const wd=new Date(date+'T12:00').getDay();if(wd===6)continue;
    st.techs.forEach(tc=>{
      let cur=DAY_START+Math.floor(r()*3)*15;const n=wd===5?1+Math.floor(r()*2):2+Math.floor(r()*3);
      for(let i=0;i<n;i++){
        const ty=pick(types.filter(x=>x.cat===tc.cat));
        const actual=Math.max(20,Math.round(ty.base*(0.8+r()*0.45)/5)*5);
        ty.samples.push(actual);
        const c=pick(CUSTOMERS);const no=++st.seq;
        const stars=r()<.72?5:r()<.6?4:r()<.6?3:2;
        const startAt=new Date(date+'T'+fromMin(cur)+':00');
        const j={id:'j'+no,no,createdAt:new Date(startAt.getTime()-86400000).toISOString(),source:pick(SOURCES),customer:c[0],city:c[1],contact:c[2],phone:'',address:c[0].replace(/^ועד בית /,'')+', '+c[1],
          cat:tc.cat,type:ty.id,desc:'',urgent:false,techId:tc.id,date,start:fromMin(cur),dur:ty.base,status:'closed',
          result:r()<.85?'ok':'follow',parts:[],notes:'',photos:{},techStart:startAt.toISOString(),techEnd:new Date(startAt.getTime()+actual*60000).toISOString(),
          approvedAt:new Date(startAt.getTime()+(actual+8)*60000).toISOString(),
          feedback:r()<.82?{stars,text:stars>=4?pick(['טכנאי מקצועי ואדיב','הגיע בזמן והסביר הכל','שירות מעולה, תודה','מהיר ונקי']):pick(['איחר קצת','לא הסביר מה הוחלף']),at:new Date(startAt.getTime()+(actual+40)*60000).toISOString()}:null,
          final:'done'};
        st.jobs.push(j);cur+=actual+st.settings.gap+Math.floor(r()*3)*15;if(cur>DAY_END-60)break;
      }
    });
  }
  // today + tomorrow, open work
  const plan=[
    [t0,'sami','s1','08:00','sent'],[t0,'sami','s2','10:00','done_tech'],[t0,'moti','s4','08:30','sent'],[t0,'moti','s3','11:00','scheduled'],
    [t0,'fadi','p2','08:00','approved'],[t0,'fadi','p1','10:30','sent'],[t0,'avi','t1','07:30','sent'],[t0,'yossi','f1','09:00','sent'],[t0,'yossi','f2','10:30','scheduled'],
    [t0,'nir','r2','08:00','done_tech'],[t0,'nir','r1','10:30','sent'],
    [addDays(t0,1),'sami','s2','08:00','scheduled'],[addDays(t0,1),'moti','s1','08:00','scheduled'],[addDays(t0,1),'fadi','p3','08:00','scheduled'],
    [addDays(t0,1),'fadi','p1','11:00','scheduled'],[addDays(t0,1),'avi','t2','08:00','scheduled'],[addDays(t0,1),'yossi','f1','08:00','scheduled'],[addDays(t0,1),'nir','r1','09:00','scheduled'],
  ];
  plan.forEach(([date,tid,tyid,start,status],i)=>{
    const c=CUSTOMERS[(i*7)%CUSTOMERS.length];const ty=types.find(x=>x.id===tyid);const no=++st.seq;
    const j={id:'j'+no,no,createdAt:new Date(Date.now()-(20-i)*3600000).toISOString(),source:SOURCES[i%4],customer:c[0],city:c[1],contact:c[2],phone:'',
      address:c[0].replace(/^ועד בית /,'')+', '+c[1],cat:ty.cat,type:tyid,desc:i%3===0?'הדיירים מדווחים על רעש חזק מהמשאבה':i%3===1?'אין מים בקומות העליונות':'',
      urgent:i===2||i===4,techId:tid,date,start,dur:estDur(tyid).min,status,result:null,parts:[],notes:'',photos:{},final:null};
    if(['done_tech','approved'].includes(status)){j.result='ok';j.parts=[{n:PARTS[ty.cat][0],q:1}];j.notes='הוחלף חלק, נבדק תקין';
      j.techStart=new Date(date+'T'+start+':00').toISOString();j.techEnd=new Date(new Date(j.techStart).getTime()+j.dur*60000).toISOString();}
    if(status==='approved')j.approvedAt=new Date().toISOString();
    st.jobs.push(j);
  });
  st.log=[{at:new Date().toISOString(),who:'מערכת',text:'נטענו נתוני דוגמה'}];
  return st;
}

/* ============ scheduling ============ */
function busy(techId,date,exceptId){
  return S.jobs.filter(j=>j.techId===techId&&j.date===date&&j.id!==exceptId).map(j=>[toMin(j.start),toMin(j.start)+j.dur]);
}
function freeSlot(techId,date,dur){
  const gap=+S.settings.gap||0;let from=DAY_START;
  if(date===TODAY()){const n=new Date();from=Math.max(DAY_START,Math.ceil((n.getHours()*60+n.getMinutes()+30)/15)*15);}
  const b=busy(techId,date).sort((a,c)=>a[0]-c[0]);
  for(let s=from;s+dur<=DAY_END;s+=15){
    if(b.every(([x,y])=>s+dur+gap<=x||s>=y+gap))return s;
  }
  return null;
}
function suggest(catId,typeId,urgent,date,from){
  const dur=estDur(typeId).min;const techs=ACT().filter(t=>t.cat===catId);
  let d=date||from||(urgent?TODAY():addDays(TODAY(),1));
  for(let k=0;k<10;k++,d=addDays(d,1)){
    if(new Date(d+'T12:00').getDay()===6)continue;
    let best=null;
    techs.forEach(t=>{const s=freeSlot(t.id,d,dur);if(s!=null&&(!best||s<best.s))best={t,s}});
    if(best)return{techId:best.t.id,date:d,start:fromMin(best.s),dur};
    if(date)break;
  }
  return{techId:techs[0]?.id,date:d,start:'08:00',dur};
}

function route(){
  document.getElementById('ov')?.remove();
  if(!unlocked()&&!window._unlocked)return renderGate();
  const h=location.hash.slice(1);const[p,id]=h.split('/');
  if(p==='tech'&&id)return renderTech(id);

function setTech(id,k,v){const t=S.techs.find(x=>x.id===id);const old=t[k];t[k]=v;log(`טכנאי ${t.name}: ${k==='cat'?'תחום שונה מ'+cat(old).name+' ל'+cat(v).name:'שם שונה מ'+old}`);save();}
const openJobs=id=>S.jobs.filter(j=>j.techId===id&&(j.status==='scheduled'||j.status==='sent'));
function addTech(){
  const name=$('#new-tech-name').value.trim(),c=$('#new-tech-cat').value;
  if(!name){toast('צריך שם לטכנאי');$('#new-tech-name').focus();return}
  if(ACT().some(t=>t.name===name)){toast('כבר יש טכנאי בשם הזה');return}
  const id='t'+Date.now().toString(36);S.techs.push({id,name,cat:c});
  log(`נוסף טכנאי: ${name} (${cat(c).name})`);save();viewSettings();toast(name+' נוסף. קריאות חדשות ב'+cat(c).name+' יכולות להשתבץ אליו.');
}
function removeTech(id){
  const t=tech(id);const open=openJobs(id);const others=ACT().filter(x=>x.cat===t.cat&&x.id!==id);
  if(open.length&&!others.length){alert(`ל${t.name} יש ${open.length} קריאות פתוחות, ואין טכנאי אחר ב${cat(t.cat).name}. קודם מוסיפים טכנאי לתחום או מעבירים את הקריאות.`);return}
  const msg=open.length?`להסיר את ${t.name}? ${open.length} הקריאות הפתוחות שלו יעברו ל${others.map(o=>o.name).join(' / ')}, לשעה הפנויה הבאה.`:`להסיר את ${t.name}?`;
  if(!confirm(msg))return;
  t.removed=true;
  open.forEach(j=>{const s=suggest(j.cat,j.type,false,undefined,j.date<TODAY()?TODAY():j.date);const old=`${dayName(j.date)} ${j.start}`;Object.assign(j,{techId:s.techId,date:s.date,start:s.start,status:'scheduled'});
    log(`קריאה #${j.no} הועברה מ${t.name} (${old}) ל${tech(s.techId).name}, ${dayName(s.date)} ${s.start}`)});
  log(`הוסר טכנאי: ${t.name}`);if(VIEW.techId===id)VIEW.techId=ACT()[0]?.id;save();viewSettings();
  toast(open.length?`${t.name} הוסר, ${open.length} קריאות הועברו. צריך לשלוח להן את הסידור שוב.`:`${t.name} הוסר`);
}
function setType(id,v){const t=S.types.find(x=>x.id===id);log(`משך התחלתי ל"${t.name}" שונה מ-${t.base} ל-${v} דק׳`);t.base=Math.max(15,+v||60);save();viewSettings();}
function setSet(k,v){S.settings[k]=v;log(`הגדרה עודכנה: ${k}`);save();}

function custHistory(j){
  const h=S.jobs.filter(x=>x.customer===j.customer&&x.id!==j.id&&x.result).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  return h.length?h.map(x=>`<div class="small" style="padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="openJob('${x.id}')"><b>${new Date(x.date+'T12:00').toLocaleDateString('he-IL')}</b> · ${esc(type(x.type).name)} · ${esc(tech(x.techId).name)}${x.result?' · '+RESULTS[x.result]:''}</div>`).join(''):'<p class="small muted">ביקור ראשון אצל הלקוח</p>';

function waLinkify(msg){return esc(msg).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}">${u.length>48?u.slice(0,45)+'…':u}</a>`)}
function waChat(name,msg,{sub='WhatsApp',day='היום',time}={}){
  const tm=time||new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  return `<div class="wa-chat"><div class="wa-top"><div class="wa-av">${esc((name||'?').trim()[0])}</div><div><b>${esc(name)}</b><small>${esc(sub)}</small></div></div>
    <div class="wa-body"><span class="wa-day">${esc(day)}</span><div class="wa-bub">${waLinkify(msg)}<span class="wa-meta">${tm}<i>✓✓</i></span></div></div></div>`;
}
function waBlock(title,msg,btn,onSend,to){

      <button class="btn" onclick="closeJob('${j.id}','follow')">המשך טיפול (פותח קריאה חדשה)</button></div></div>`;
  return `<div class="card sec"><h4>דוח סופי · ${j.final==='follow'?'המשך טיפול':'הטיפול הסתיים'}</h4><div class="acts">
    <a class="btn pri" href="#report/${j.id}">דוח PDF</a><a class="btn wa" href="${waLink(`שלום ${j.contact}, מצורף דוח הביקור מ${S.settings.company}: ${link('report/'+j.id)}`)}" target="_blank" rel="noopener">שליחת הדוח ללקוח</a></div></div>`;
}
function markSent(id){const j=job(id);if(j.status==='scheduled'){j.status='sent';log(`קריאה #${j.no} נשלחה לטכנאי ${tech(j.techId).name}`);save();setTimeout(()=>{if(isOffice()){refresh();openJob(id)}},60)}}
function reschedule(id){const j=job(id);const t=$('#d-tech').value,d=$('#d-date').value,h=$('#d-time').value;
  log(`קריאה #${j.no} הועברה: ${tech(j.techId).name} ${dayName(j.date)} ${j.start} → ${tech(t).name} ${dayName(d)} ${h}`);
  Object.assign(j,{techId:t,date:d,start:h});if(j.status==='sent')j.status='scheduled';save();refresh();openJob(id);toast('השיבוץ עודכן. צריך לשלוח לטכנאי שוב.')}
function closeJob(id,final){
  const j=job(id);j.final=final;j.status='closed';log(`קריאה #${j.no} נסגרה: ${final==='done'?'הטיפול הסתיים':'המשך טיפול'}`);
  if(final==='follow'){const s=suggest(j.cat,j.type,false);const no=nextNo();
    S.jobs.push({...j,id:'j'+no,no,createdAt:new Date().toISOString(),source:'המשך טיפול',desc:'המשך טיפול לקריאה #'+j.no+(j.notes?': '+j.notes:''),urgent:false,
      techId:s.techId,date:s.date,start:s.start,dur:s.dur,status:'scheduled',result:null,parts:[],notes:'',photos:{},techStart:null,techEnd:null,approvedAt:null,feedback:null,final:null,followOf:j.id});
    log(`קריאת המשך #${no} נפתחה ושובצה ל${tech(s.techId).name}, ${dayName(s.date)} ${s.start}`);toast('נפתחה קריאת המשך #'+no);}
  save();refresh();openJob(id);
}
function refresh(){if(!$('#view'))return;if(VIEW.tab==='board')viewBoard();else if(VIEW.tab==='calls')viewCalls();}
function openDaySend(date){
  const ov=document.createElement('div');ov.className='ov';ov.id='ov';ov.onclick=e=>{if(e.target===ov)ov.remove()};
  const techs=ACT().filter(t=>S.jobs.some(j=>j.techId===t.id&&j.date===date));
  ov.innerHTML=`<div class="drawer"><div class="bar"><h1 style="font-size:19px">הסידור ל${dayName(date)}</h1><button class="x" onclick="$('#ov').remove()">×</button></div>
  <p class="small muted">כל טכנאי מקבל הודעה אחת עם כל הקריאות שלו, כדי שבבוקר לא יחכה לאף אחד. כל שורה כוללת קישור לטופס הסיום.</p>
  ${techs.map(t=>waBlock(t.name+' · '+cat(t.cat).name,dayMsg(t.id,date),'שליחה ל'+esc(t.name),`sendDay('${t.id}','${date}')`,t.name)).join('')||'<p class="muted" style="margin-top:12px">אין קריאות ביום הזה</p>'}</div>`;
  document.body.appendChild(ov);
}
function sendDay(tid,date){S.jobs.filter(j=>j.techId===tid&&j.date===date&&j.status==='scheduled').forEach(j=>j.status='sent');log(`הסידור ל${dayName(date)} נשלח ל${tech(tid).name}`);save();setTimeout(()=>{if(isOffice())refresh()},60)}

/* ============ technician (phone, no login) ============ */
let TD=null;
function renderTech(id){
  const j=job(id);if(!j)return notFound();
  if(!TD||TD.id!==id)TD={id,result:j.result,parts:Object.fromEntries((j.parts||[]).map(p=>[p.n,p.q])),notes:j.notes||'',photos:{...j.photos}};
  const done=['done_tech','approved','closed'].includes(j.status);
  const started=!!j.techStart;
  $('#app').innerHTML=`<div class="phone">
    <div class="ph-h"><div class="sm">${esc(S.settings.company)} · קריאה #${j.no}</div>
      <div style="font-size:19px;font-weight:800;margin-top:2px">${esc(type(j.type).name)}</div>
      <div style="margin-top:4px">${esc(j.customer)}</div><div class="sm">${esc(j.address)} · ${dayName(j.date)} ${j.start}</div></div>
    <div class="acts" style="margin:10px 0"><a class="btn" href="https://waze.com/ul?q=${encodeURIComponent(j.address)}" target="_blank" rel="noopener">ניווט</a>${j.phone?`<a class="btn" href="tel:${esc(j.phone)}">התקשרות ל${esc(j.contact)}</a>`:`<span class="btn" style="opacity:.6">איש קשר: ${esc(j.contact)}</span>`}</div>
    ${j.desc?`<div class="card sec"><h4>מה דווח</h4>${esc(j.desc)}</div>`:''}
    <div class="card sec"><h4>ביקורים קודמים אצל הלקוח</h4>${custHistory(j).replace(/onclick="openJob\('[^']+'\)"/g,'')}</div>
    ${done?`<div class="card sec" style="text-align:center"><div style="font-size:34px">✓</div><h4>הטופס נשלח למשרד</h4><p class="muted small">הלקוח מקבל הודעה בוואטסאפ לאישור הביקור.</p></div>`:
    !started?`<button class="btn pri" style="width:100%;justify-content:center;padding:14px;font-size:17px;margin-top:12px" onclick="techStart('${id}')">התחלתי עבודה</button>`:`
    <div class="card sec"><h4>1. תוצאה</h4><div class="big-btns">${Object.entries(RESULTS).map(([k,v])=>`<button class="choice ${TD.result===k?'on':''}" onclick="TD.result='${k}';renderTech('${id}')">${v}</button>`).join('')}</div></div>
    <div class="card sec"><h4>2. חלקים שהוחלפו</h4>${PARTS[j.cat].map(p=>`<div class="part"><span>${p}</span><span class="qty"><button onclick="tq('${id}','${p}',-1)">−</button><b>${TD.parts[p]||0}</b><button onclick="tq('${id}','${p}',1)">+</button></span></div>`).join('')}
      <p class="small muted" style="margin-top:6px">לא הוחלף כלום? משאירים ריק.</p></div>
    <div class="card sec"><h4>3. תמונות</h4><div class="photos">${['before','after'].map(k=>`<label class="ph-slot">${TD.photos[k]?`<img src="${TD.photos[k]}">`:`<span>📷<br>${k==='before'?'לפני':'אחרי'}</span>`}<input type="file" accept="image/*" capture="environment" onchange="tPhoto('${id}','${k}',this)"></label>`).join('')}</div></div>
    <div class="card sec"><h4>4. הערה (לא חובה)</h4><textarea oninput="TD.notes=this.value" placeholder="מה נעשה, מה כדאי לבדוק בפעם הבאה">${esc(TD.notes)}</textarea></div>
    <button class="btn go" style="width:100%;justify-content:center;padding:14px;font-size:17px;margin-top:12px" ${TD.result?'':'disabled'} onclick="techSubmit('${id}')">סיום ושליחה למשרד</button>
    ${TD.result?'':'<p class="small muted" style="text-align:center;margin-top:6px">בוחרים תוצאה כדי לשלוח</p>'}`}
    <p class="noprint" style="text-align:center;margin-top:20px"><a class="small" href="#${VIEW.from==='techview'?'techview':'board'}" onclick="TD=null">${VIEW.from==='techview'?'חזרה לרשימת הקריאות':'חזרה למסך המשרד'}</a></p>
  </div>`;
}
function techStart(id){const j=job(id);j.techStart=new Date().toISOString();if(j.status==='scheduled')j.status='sent';log(`${tech(j.techId).name} התחיל עבודה בקריאה #${j.no}`,tech(j.techId).name);save();renderTech(id)}
function tq(id,p,d){TD.parts[p]=Math.max(0,(TD.parts[p]||0)+d);renderTech(id)}
function tPhoto(id,k,input){
  const f=input.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);
  img.onload=()=>{const m=900;const sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);TD.photos[k]=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);renderTech(id)};
  img.src=url;
}
function techSubmit(id){
  const j=job(id);j.result=TD.result;j.parts=Object.entries(TD.parts).filter(([,q])=>q>0).map(([n,q])=>({n,q}));j.notes=TD.notes.trim();j.photos=TD.photos;
  j.techEnd=new Date().toISOString();j.status='done_tech';
  const mins=Math.round((new Date(j.techEnd)-new Date(j.techStart))/60000);
  if(mins>=5&&mins<=600)type(j.type).samples.push(mins);
  log(`${tech(j.techId).name} סיים את קריאה #${j.no}: ${RESULTS[j.result]}${j.parts.length?', חלקים: '+j.parts.map(p=>p.n).join(', '):''}`,tech(j.techId).name);
  save();TD=null;renderTech(id);window.scrollTo(0,0);
}

/* ============ customer approval ============ */
function renderCust(id){
  const j=job(id);if(!j)return notFound();
  const ok=!!j.approvedAt;
  $('#app').innerHTML=`<div class="phone">
    <div class="ph-h"><div class="sm">${esc(S.settings.company)}</div><div style="font-size:18px;font-weight:800;margin-top:2px">סיכום ביקור · קריאה #${j.no}</div><div class="sm">${fullDate(j.date)}</div></div>
    <div class="card sec"><div class="kv"><div>כתובת</div><div>${esc(j.address)}</div><div>עבודה</div><div>${esc(type(j.type).name)}</div><div>טכנאי</div><div>${esc(tech(j.techId).name)}</div>
      <div>תוצאה</div><div class="b">${RESULTS[j.result]||'—'}</div><div>חלקים</div><div>${j.parts.length?j.parts.map(p=>esc(p.n)+(p.q>1?' ×'+p.q:'')).join(', '):'ללא'}</div>${j.notes?`<div>הערות</div><div>${esc(j.notes)}</div>`:''}</div>
      ${(j.photos.before||j.photos.after)?`<div class="photos" style="margin-top:10px">${['before','after'].map(k=>j.photos[k]?`<figure style="margin:0"><img src="${j.photos[k]}" style="width:100%;border-radius:10px;aspect-ratio:4/3;object-fit:cover"><figcaption class="small b">${k==='before'?'לפני':'אחרי'}</figcaption></figure>`:'').join('')}</div>`:''}</div>
    ${ok?`<div class="card sec" style="text-align:center"><div style="font-size:34px">✓</div><h4>תודה, הביקור אושר</h4><p class="small muted">דוח הביקור יישלח אליכם בוואטסאפ.</p></div>`:
    `<div class="big-btns" style="margin-top:12px"><button class="btn go" style="justify-content:center;padding:14px;font-size:17px" onclick="custOk('${id}')">אני מאשר, שבע רצון</button>
      <button class="btn" style="justify-content:center;padding:12px" onclick="custNote('${id}')">יש לי הערה</button></div>`}
    <p style="text-align:center;margin-top:20px"><a class="small" href="#board">חזרה למסך המשרד</a></p></div>`;
}
function custOk(id){const j=job(id);j.approvedAt=new Date().toISOString();j.status='approved';log(`הלקוח ${j.customer} אישר את קריאה #${j.no}`,'לקוח');save();renderCust(id)}
function custNote(id){const t=prompt('מה ההערה?');if(!t)return;const j=job(id);j.notes=(j.notes?j.notes+'\n':'')+'הערת לקוח: '+t;log(`הערת לקוח בקריאה #${j.no}: ${t}`,'לקוח');save();toast('ההערה נשלחה למשרד');renderCust(id)}

/* ============ feedback ============ */
let FB={stars:0,text:''};
function renderFb(id){
  const j=job(id);if(!j)return notFound();
  const done=!!j.feedback;
  $('#app').innerHTML=`<div class="phone">
    <div class="ph-h"><div class="sm">${esc(S.settings.company)}</div><div style="font-size:18px;font-weight:800;margin-top:2px">איך היה הביקור של ${esc(tech(j.techId).name)}?</div></div>
    ${done?`<div class="card sec" style="text-align:center"><div style="font-size:34px">🙏</div><h4>תודה על המשוב</h4>
      <p class="small muted" style="margin:6px 0 12px">נשמח מאוד אם תכתבו כמה מילים גם בגוגל. זה עוזר לאנשים אחרים למצוא אותנו.</p>
      ${S.settings.google?`<a class="btn pri" href="${esc(S.settings.google)}" target="_blank" rel="noopener">כתיבת ביקורת בגוגל</a>`:`<span class="btn" style="opacity:.6">כתיבת ביקורת בגוגל</span><p class="small muted" style="margin-top:6px">(הקישור מוגדר במסך ההגדרות)</p>`}</div>`:`
    <div class="card sec" style="text-align:center"><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${FB.stars>=n?'on':''}" onclick="FB.stars=${n};renderFb('${id}')">★</button>`).join('')}</div>
      <textarea style="margin-top:12px" placeholder="כמה מילים: מה היה טוב, מה לשפר" oninput="FB.text=this.value">${esc(FB.text)}</textarea>
      <button class="btn pri" style="margin-top:12px;width:100%;justify-content:center;padding:12px" ${FB.stars?'':'disabled'} onclick="fbSend('${id}')">שליחה</button></div>`}
    <p style="text-align:center;margin-top:20px"><a class="small" href="#board">חזרה למסך המשרד</a></p></div>`;
}
function fbSend(id){const j=job(id);j.feedback={stars:FB.stars,text:FB.text.trim(),at:new Date().toISOString()};log(`משוב על ${tech(j.techId).name} בקריאה #${j.no}: ${FB.stars} כוכבים`,'לקוח');FB={stars:0,text:''};save();renderFb(id)}

/* ============ report (print to PDF) ============ */
function renderReport(id){
  const j=job(id);if(!j)return notFound();
  $('#app').innerHTML=`<div class="wrap" style="padding:20px 16px">
    <div class="acts noprint" style="justify-content:center;margin-bottom:14px"><button class="btn pri" onclick="window.print()">שמירה כ-PDF</button><a class="btn" href="#board">חזרה למשרד</a></div>
    <div class="report">
      <div class="rep-h"><div><h1>${esc(S.settings.company)}</h1><div class="muted small">דוח ביקור שירות</div></div>
        <div style="text-align:left"><div class="b">קריאה #${j.no}</div><div class="small muted">${fullDate(j.date)}</div></div></div>
      <table class="rep-tbl"><tbody>
        <tr><td>לקוח</td><td>${esc(j.customer)}</td></tr><tr><td>כתובת</td><td>${esc(j.address)}</td></tr>
        <tr><td>סוג עבודה</td><td>${esc(type(j.type).name)} (${cat(j.cat).name})</td></tr><tr><td>טכנאי</td><td>${esc(tech(j.techId).name)}</td></tr>
        ${j.techStart?`<tr><td>שעות</td><td>${new Date(j.techStart).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}–${j.techEnd?new Date(j.techEnd).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):''}</td></tr>`:''}
        ${j.desc?`<tr><td>מה דווח</td><td>${esc(j.desc)}</td></tr>`:''}
        <tr><td>תוצאה</td><td><b>${RESULTS[j.result]||'—'}</b></td></tr>
        <tr><td>חלקים</td><td>${j.parts.length?j.parts.map(p=>esc(p.n)+(p.q>1?' ×'+p.q:'')).join(', '):'ללא'}</td></tr>
        ${j.notes?`<tr><td>הערות</td><td style="white-space:pre-wrap">${esc(j.notes)}</td></tr>`:''}
        <tr><td>אישור לקוח</td><td>${j.approvedAt?`${esc(j.contact)} אישר בוואטסאפ · ${ts(j.approvedAt)}`:'ממתין לאישור'}</td></tr>
        <tr><td>סטטוס סופי</td><td><b>${j.final==='follow'?'המשך טיפול':j.final==='done'?'הטיפול הסתיים':'פתוח'}</b></td></tr>
      </tbody></table>
      <h3 style="margin-top:18px;font-size:16px">תמונות</h3>
      <div class="rep-ph">${['before','after'].map(k=>`<figure>${j.photos[k]?`<img src="${j.photos[k]}">`:'<div class="noimg">לא צולמה תמונה</div>'}<figcaption>${k==='before'?'לפני':'אחרי'}</figcaption></figure>`).join('')}</div>
      <p class="small muted" style="margin-top:22px;text-align:center">${esc(S.settings.company)} · שירות חירום 24/7</p>
    </div></div>`;
}
/* ============ entry lock (browser only) ============ */
const LOCK='dudi-field-unlocked';
function unlocked(){try{return localStorage.getItem(LOCK)==='1'}catch(e){return false}}
function renderGate(){
  $('#app').innerHTML=`<div class="phone" style="padding-top:12vh"><div class="card sec" style="text-align:center;padding:26px">
    <div class="mark" style="margin:0 auto 10px;width:46px;height:46px;font-size:20px">ד</div>
    <h4 style="font-size:19px">${esc(S.settings.company)}</h4><p class="muted small" style="margin:4px 0 16px">מערכת שירות · כניסה</p>
    <form onsubmit="return tryUnlock(event)"><input type="password" id="gate-pw" placeholder="סיסמה" autocomplete="current-password" style="text-align:center">
    <button class="btn pri" style="width:100%;justify-content:center;margin-top:10px;padding:11px">כניסה</button>
    <p id="gate-err" class="small" style="color:var(--red);min-height:20px;margin-top:6px"></p></form></div></div>`;
  setTimeout(()=>$('#gate-pw')?.focus(),50);
}
function tryUnlock(e){e.preventDefault();if($('#gate-pw').value.trim()==='1'){try{localStorage.setItem(LOCK,'1')}catch(_){window._unlocked=true}route()}else{$('#gate-err').textContent='סיסמה שגויה';$('#gate-pw').select()}return false}

function notFound(){$('#app').innerHTML='<div class="phone"><div class="card sec">הקריאה לא נמצאה. <a href="#board">חזרה</a></div></div>'}

route();
</script>
</body>
</html>
