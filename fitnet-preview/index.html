/* One question, clear choices, and a single next action. */
body{font-family:Rubik,Arial,sans-serif}
.annotation{text-align:center}
.kicker{justify-content:center}
.annotation h1.kicker{font-size:16px;font-weight:500;letter-spacing:0;line-height:1.5;margin:0 0 14px}
.annotation>.instruction{display:block;font-size:26px;font-weight:500;line-height:1.55;margin:0;color:#292824;text-wrap:balance}
@media(max-width:760px){.annotation>.instruction{font-size:21px}}
.annotation>.feedback:empty{display:none}
.phone{min-height:821px;display:flex;flex-direction:column;background:#fffefa}
.status{flex-shrink:0}
.app-header{padding-bottom:28px}
.progress{flex-shrink:0;margin-bottom:32px;background:#ece9e1}
.progress span{background:#c08b36}
.question{text-align:center}
.question h2{font-size:30px;line-height:1.35;font-weight:600;letter-spacing:-.6px;margin-bottom:30px}
#goal-form{flex:1;display:flex;flex-direction:column}
fieldset{gap:12px}
.choice{min-height:78px;padding:15px 13px;border-radius:16px;border-color:#e5e2d9;background:#fff}
.icon{background:#f3f0e8;color:#8c744d;width:38px;height:38px}
.copy{text-align:right}
.copy strong{font-size:16px;font-weight:500;letter-spacing:-.3px;line-height:1.5}
.option input:checked+.choice{background:#2d322e;border-color:#2d322e;color:#fff;box-shadow:0 5px 14px #2d322e12}
.option input:checked+.choice .icon{background:#41483e;color:#edc477}
.option input:checked+.choice .radio{background:#edc477;border-color:#edc477}
.option input:checked+.choice .radio:after{color:#2d322e;font-weight:700}
.login{font-size:11px}
.step{font-size:11px}
.next{font-size:17px;font-weight:600;min-height:53px;margin-top:auto;background:#edc477;color:#302718;box-shadow:0 4px 12px #b8833412}
.next:disabled{background:#ece9e1;color:#797469;box-shadow:none}
fieldset{margin-bottom:28px}
.home-bar{margin:26px auto 10px;flex-shrink:0}
.preview-nav{display:flex;direction:ltr;justify-content:center;gap:9px;margin-top:22px}
.preview-nav button{width:44px;height:44px;border:1px solid #dedad1;border-radius:50%;background:transparent;color:#77746d;font-size:14px}
.preview-nav button[aria-current="step"]{background:#2d322e;border-color:#2d322e;color:#edc477}
.back{border:0;background:none;color:#666158;font-size:11px;padding:0;display:flex;align-items:center;gap:5px}
.back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7}
.number-icon{font-size:15px;font-weight:500;direction:ltr}
.demo-end{font-size:12px;text-align:center;color:#666158;line-height:1.6;margin:10px 0 0}
.demo-end:empty{display:none}
.question h2:focus{outline:none}
@media(max-width:760px){.question h2{font-size:28px}.choice{gap:9px;padding:14px 10px}.copy strong{font-size:15px}.annotation>.feedback{display:block}.annotation>.feedback:empty{display:none}}
