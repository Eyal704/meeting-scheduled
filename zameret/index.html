<style>
:root{
  --ink:#16232b;--muted:#5f6b72;--faint:#9aa4aa;--line:#e3e7e9;--line2:#eef1f2;
  --bg:#f4f6f7;--card:#fff;--brand:#183b4a;--brand2:#1f5d6e;--teal:#1e7d6c;--teal-t:#e6f3f0;
  --red:#c2413b;--red-t:#fbeceb;--amber:#b7791f;--amber-t:#fbf3e4;--blue:#2c6aa0;--blue-t:#e9f1f8;
  --green:#2f7d4f;--green-t:#e8f4ec;--radius:14px;--shadow:0 1px 2px rgba(16,35,43,.06),0 4px 14px rgba(16,35,43,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.app{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.logo svg{width:26px;height:26px}
.logo small{display:block;font-weight:400;font-size:11.5px;opacity:.75;letter-spacing:0}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px}
.who .av{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;opacity:.85;max-width:1100px;margin:6px auto 0}
.sync i{width:7px;height:7px;border-radius:50%;background:#7fe0b4;display:inline-block}
.sync.off i{background:#f2b45a}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13.5px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.kpis{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.kpi{display:inline-flex;align-items:baseline;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--muted)}
.kpi b{font-size:14px;color:var(--ink);font-weight:800}
.kpi.hot{background:var(--red-t);border-color:transparent;color:var(--red)}.kpi.hot b{color:var(--red)}
.offline[hidden]{display:none}
.head{margin:0 0 10px}h1{font-size:20px}
/* landing */
.hero{background:linear-gradient(160deg,#183b4a 0%,#1d4d5c 55%,#1e6b62 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 78px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.06);left:-140px;bottom:-230px}
.hero-in{max-width:560px;margin:0 auto;position:relative;z-index:1}
.logo.big svg{width:34px;height:34px}.logo.big{font-size:18px}
.hero-t{font-size:34px;line-height:1.12;font-weight:800;letter-spacing:-.6px;margin-top:34px}
.hero-p{font-size:15px;line-height:1.55;color:#cfe3e6;margin-top:10px;max-width:420px}
.pick2{max-width:560px;margin:-54px auto 0;padding:0 14px 30px;position:relative;z-index:2}
.pcard{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(16,35,43,.12);padding:18px 14px 6px}
.pcard-h{font-size:20px;font-weight:800;padding:0 4px 4px}
.psec{padding:10px 0 12px;border-top:1px solid var(--line2)}
.psec:first-of-type{border-top:0}
.psec-h{display:flex;align-items:baseline;gap:8px;padding:0 4px 8px}
.psec-h b{font-size:14px}.psec-h span{font-size:12px;color:var(--faint)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles.one{grid-template-columns:1fr}
.tile{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid transparent;border-radius:14px;padding:10px;text-align:right;transition:background .15s,border-color .15s}
.tile:hover{background:#fff;border-color:var(--line)}
.tile:active{transform:scale(.98)}
.tav{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;color:#fff;background:var(--brand)}
.tav-tech{background:var(--teal)}.tav-guy{background:#b7791f}.tav-office{background:var(--blue)}
.tt{display:flex;flex-direction:column;min-width:0;flex:1}
.tt b{font-size:15px;line-height:1.2}.tt span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdesc{font-size:12.5px;color:var(--muted);margin-inline-start:auto}
.tgo{color:var(--faint);font-size:20px;line-height:1;margin-inline-start:4px}
.tiles:not(.one) .tgo{display:none}
@media(max-width:360px){.tdesc{display:none}}
.tip{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.tip b{color:var(--ink)}
.tip-i{width:30px;height:30px;border-radius:9px;background:var(--teal-t);color:var(--teal);display:grid;place-items:center;flex:none}
.tip-i svg{width:17px;height:17px}
.reset-l{font-size:12px;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.pnote{text-align:center;font-size:12px;color:var(--faint);margin-top:14px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.stat.hot b{color:var(--red)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer;transition:transform .08s}
.card.tap:active{transform:scale(.99)}
.card.stopped{border-right:4px solid var(--red)}
.card.flag{border-right:4px solid var(--amber)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.addr{font-size:17px;font-weight:700;letter-spacing:-.2px}
.issue{font-weight:600;margin-top:2px}
.detail{color:var(--muted);font-size:13.5px;margin-top:4px}
.card .detail{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sheet .detail,.box .detail{display:block;-webkit-line-clamp:unset}
.meta:empty{display:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;background:var(--line2);color:var(--muted);border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--line2);color:var(--muted)}
.pill.red{background:var(--red-t);color:var(--red)}
.pill.amber{background:var(--amber-t);color:var(--amber)}
.pill.blue{background:var(--blue-t);color:var(--blue)}
.pill.green{background:var(--green-t);color:var(--green)}
.pill.teal{background:var(--teal-t);color:var(--teal)}
.time{font-size:12px;color:var(--faint);white-space:nowrap}
.section-t{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.section-t .n{background:var(--line);border-radius:999px;padding:0 8px;font-size:12px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:14px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:11px 14px;font-weight:600;font-size:14.5px;background:var(--line2);color:var(--ink);min-height:44px}
.btn.primary{background:var(--teal);color:#fff}
.btn.dark{background:var(--brand);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
a.btn{text-decoration:none}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.step{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-weight:600;font-size:14px;background:#fff}
.step small{display:block;font-weight:400;font-size:11.5px;color:var(--faint)}
.step.done{border-color:var(--teal);background:var(--teal-t);color:var(--teal)}
.step.next{border-color:var(--teal);background:var(--teal);color:#fff}
.step.next small{color:#d8f0ea}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav-in{display:flex;gap:4px;max-width:560px;width:100%}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 2px;border-radius:10px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand);font-weight:700;background:var(--line2)}
.badge{position:absolute;top:2px;left:calc(50% - 22px);background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(16,30,36,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;border-radius:18px 18px 0 0;overflow:auto;-webkit-overflow-scrolling:touch;animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sheet-head{position:sticky;top:0;background:var(--bg);z-index:2;padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-body{padding:14px 16px 20px}
.x{width:36px;height:36px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:18px;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
/* forms */
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.in,textarea.in,select.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;font-size:15px;outline:none}
.in:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-t)}
textarea.in{min-height:96px;resize:vertical}
.choices{display:flex;flex-wrap:wrap;gap:7px}
.choice{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:14px;font-weight:500}
.choice.on{border-color:var(--teal);background:var(--teal-t);color:var(--teal);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.kv span{display:block;font-size:11.5px;color:var(--faint)}
.kv b{font-weight:600;font-size:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.box h4{font-size:14px;margin-bottom:6px}
.warn{background:var(--amber-t);color:#7a5212;border-radius:11px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.danger{background:var(--red-t);color:#8c2b27;border-radius:11px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.info{background:var(--blue-t);color:#22527c;border-radius:11px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.ok{background:var(--green-t);color:#245f3d;border-radius:11px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.mic{position:relative}
.mic .micbtn{position:absolute;left:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.mic .micbtn.rec{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(194,65,59,.15)}}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.addph{width:76px;height:76px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;background:#fff}
.def{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2)}
.def:first-of-type{border-top:0}
.def input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal)}
.def .who2{font-size:12px;color:var(--faint)}
.parts{display:flex;flex-direction:column;gap:6px}
.part{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--line2);font-weight:700}
.log{font-size:13px;color:var(--muted)}
.log div{padding:5px 0;border-top:1px solid var(--line2);display:flex;gap:8px}
.log div:first-child{border-top:0}
.log b{color:var(--ink);font-weight:600;white-space:nowrap}
table.lines{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.lines td{padding:6px 4px;border-top:1px solid var(--line2)}
table.lines td:last-child{text-align:left;white-space:nowrap}
table.lines tr.tot td{font-weight:800;border-top:1.5px solid var(--ink)}
/* desktop table for office */
.board{display:grid;gap:8px}
@media(min-width:900px){
  .office-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  
}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .choice{white-space:nowrap;padding:7px 12px;font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.two .box{margin-top:0}
/* picker */
.pick{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.pick h1{margin-top:14px}
.ppl{display:grid;gap:8px;margin-top:14px}
.person{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:right;box-shadow:var(--shadow)}
.person .av{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.person b{display:block;font-size:16px}
.person span{font-size:13px;color:var(--muted)}
.grp{font-size:12.5px;font-weight:700;color:var(--muted);margin:18px 4px 0}
.foot{text-align:center;font-size:11.5px;color:var(--faint);margin-top:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;z-index:80;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastIn .2s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.offline{background:var(--amber-t);color:#7a5212;font-size:13px;text-align:center;padding:7px 12px}
.live{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2)}
.live:first-child{border-top:0}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
.live .dot.go{background:var(--amber)}.live .dot.at{background:var(--teal)}.live .dot.free{background:var(--green)}
.memo-id{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(max-width:420px){.memo-id{grid-template-columns:1fr 1fr}}
.right{margin-inline-start:auto}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mt{margin-top:10px}
a.link{color:var(--blue);text-decoration:none;font-weight:600}

/* ===== desktop ===== */
.feat{display:none}
@media(min-width:900px){
  body{font-size:15px}
  .top{padding:12px 28px}
  .top-row{max-width:none}
  .app{padding-bottom:0}
  .nav{top:62px;bottom:0;right:0;left:auto;width:228px;border-top:0;border-left:1px solid var(--line);display:block;padding:18px 12px;background:#fff}
  .nav-in{flex-direction:column;max-width:none;gap:4px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:11px 12px;border-radius:11px}
  .nav button svg{width:20px;height:20px}
  .nav button.on{background:var(--teal-t);color:var(--teal)}
  .badge{position:static;margin-inline-start:auto;order:3}
  main{max-width:none;margin-right:228px;padding:26px 34px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-content:start}
  main>*:not(.card){grid-column:1/-1}
  main>.card{margin:0}
  main>.card:has(.live){grid-column:1/-1;max-width:760px}
  .office-grid{display:contents}
  .office-grid>.card{margin:0}
  .office-grid>.empty{grid-column:1/-1}
  .section-t{margin:14px 2px 0}
  .head{margin:0 0 2px}
  h1{font-size:24px}
  .kpis{margin:0 0 6px}
  .sheet-bg{align-items:stretch;justify-content:flex-end}
  .sheet{max-width:560px;width:560px;height:100vh;max-height:none;border-radius:0;animation:slideL .22s ease-out;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .sheet-head{padding:18px 22px 14px}
  .sheet-body{padding:16px 22px 28px}
  .toast{bottom:28px}
  /* landing */
  .landing{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh;background:linear-gradient(150deg,#183b4a 0%,#1d4d5c 50%,#1e6b62 100%)}
  .hero{background:none;padding:56px 64px;display:flex;align-items:center}
  .hero:after{left:auto;right:-160px;bottom:-200px;width:560px;height:560px}

function login(id){closeSheet();me=id;localStorage.setItem('zme',id);tab='';render();window.scrollTo(0,0)}
function logout(){me='';localStorage.removeItem('zme');closeSheet();render()}
const calls=()=>Object.values(db.calls).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
const memoOf=c=>c.memo?db.memos[c.memo]:null;

/* ========= notifications on change ========= */
function snapshotFor(){return Object.fromEntries(Object.values(db.calls).map(c=>[c.id,c.status+'|'+c.tech]))}
function notifyChanges(before){if(!me)return;const p=PEOPLE[me];for(const c of Object.values(db.calls)){const was=before[c.id];const now=c.status+'|'+c.tech;if(was===now)continue;
 if(p.role==='tech'&&c.tech===me&&['assigned','scheduled'].includes(c.status)&&(!was||!was.endsWith('|'+me)||!was.startsWith(c.status)))toast('קריאה חדשה שובצה אליך: '+c.address);
 else if(p.role==='guy'&&c.status==='needs_guy')toast('דיווח חדש מהשטח: '+c.address);
 else if(p.role==='office'&&c.status==='closed')toast('קריאה נסגרה: '+c.address);
 else if(p.role==='office'&&c.status==='new')toast('קריאה חדשה: '+c.address);}}

/* ========= UI shell ========= */
const DATE=()=>new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
const kpis=items=>`<div class="kpis">${items.map(([n,l,hot])=>`<span class="kpi ${hot&&n?'hot':''}"><b>${n}</b>${l}</span>`).join('')}</div>`;
const pageHead=(title,sub,action='')=>`<div class="head"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>${action}</div>`;
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
function renderSync(){const el=$('#sync');if(!el)return;const show=remote&&(!online||pending.length);el.hidden=!show;el.textContent=!online?'אין קליטה. הדיווחים יישלחו לבד כשהקליטה תחזור':pending.length?'שולח '+pending.length+' עדכונים…':''}
function shell(inner,navItems){const p=PEOPLE[me];return `<div class="app ${p.role==='tech'||p.role==='team'?'is-tech':''}"><div class="top"><div class="top-row"><div class="logo">${ICON.logo}<div>צמרת מעליות<small>${p.role==='tech'||p.role==='team'?'אפליקציית שטח':p.role==='guy'?'ניהול השירות':'מוקד השירות'}</small></div></div>
 <button class="who" onclick="openMe()">${esc(p.name)}<span class="av">${esc(p.name[0])}</span></button></div></div><div class="offline" id="sync" hidden></div>
 <main>${inner}</main>${navItems?`<nav class="nav"><div class="nav-in">${navItems.map(([id,label,ic,b])=>`<button class="${tab===id?'on':''}" onclick="tab='${id}';render();scrollTo(0,0)">${b?`<span class="badge">${b}</span>`:''}${ICON[ic]}${label}</button>`).join('')}</div></nav>`:''}</div>`}
function openMe(){const p=PEOPLE[me];sheet(`<div><b style="font-size:17px">${esc(p.name)}</b><div class="sub">${esc(p.title)}${p.area?' · '+esc(p.area):''}</div></div>`,`
 <button class="btn block dark" onclick="logout()">החלפת משתמש</button>
 <button class="btn block ghost mt" onclick="if(confirm('להחזיר את כל הקריאות למצב ההתחלתי? זה משפיע על כל מי שמחובר.'))resetAll()">איפוס הנתונים למצב ההתחלתי</button>
 <div class="info">הנתונים כאן הם לדוגמה. אחרי החיבור לפריוריטי יופיעו הקריאות, הלקוחות והתזכירים האמיתיים.</div><div class="foot">נבנה עבור צמרת מעליות · MeetingScheduled</div>`)}

/* ========= sheet ========= */
function sheet(head,body){closeSheet();const bg=document.createElement('div');bg.className='sheet-bg';bg.id='sheet';bg.innerHTML=`<div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head">${head}<button class="x" onclick="closeSheet()" aria-label="סגירה">✕</button></div><div class="sheet-body">${body}</div></div>`;bg.onclick=closeSheet;document.body.appendChild(bg);document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet')?.remove();document.body.style.overflow='';openCall=null}
let openCall=null;

/* ========= login picker ========= */
function picker(){
 const tile=(id,wide)=>{const p=PEOPLE[id];return `<button class="tile ${wide?'wide':''}" onclick="login('${id}')"><span class="tav tav-${p.role}">${p.name[0]}</span><span class="tt"><b>${p.name}</b><span>${p.area||p.title}</span></span>${wide?`<span class="tdesc">${p.role==='guy'?'רואה רק מה שצריך החלטה שלו':''}</span>`:''}<span class="tgo">‹</span></button>`};
 const sec=(t,sub,body)=>`<section class="psec"><div class="psec-h"><b>${t}</b><span>${sub}</span></div>${body}</section>`;
 return `<div class="landing"><div class="hero"><div class="hero-in"><div class="logo big">${ICON.logo}<div>צמרת מעליות<small>שירות, אחזקה ושיפוץ מעליות</small></div></div>
  <h1 class="hero-t">שירות ושטח<br>במקום אחד</h1><p class="hero-p">הטכנאי מדווח מהאתר, גיא מקבל רק את מה שצריך החלטה, והמשרד רואה מה לחייב.</p>
  <ul class="feat"><li><span>${ICON.check}</span><div><b>דיווח מהאתר בכמה לחיצות</b>יצאתי, הגעתי, דיווח עם הכתבה ותמונות</div></li><li><span>${ICON.bell}</span><div><b>גיא מקבל רק החלטות</b>שיבוץ, צוות מכני או הצעת מחיר בלחיצה</div></li><li><span>${ICON.tag}</span><div><b>חיוב לפי הכיסוי</b>ביטוח רגיל מחויב, מקיף במחיר אפס</div></li></ul></div></div>
 <div class="pick2"><div class="pcard"><div class="pcard-h">מי נכנס?</div>
  ${sec('טכנאים','אפליקציית שטח',`<div class="tiles">${['ofer','kosta','dror','moshe','patrick'].map(id=>tile(id)).join('')}</div>`)}
  ${sec('ניהול השירות','החלטות, שיבוץ ומחירון',`<div class="tiles one">${tile('guy',true)}</div>`)}
  ${sec('משרד','קריאות, שיבוץ וחיוב',`<div class="tiles">${['kristy','or'].map(id=>tile(id)).join('')}</div>`)}
 </div>
 <div class="tip"><span class="tip-i">${ICON.bell}</span><span><b>כדאי לנסות בשני טלפונים.</b> באחד נכנסים כטכנאי ובשני כגיא. דיווח מהשטח מגיע לגיא תוך כמה שניות.</span></div>
 <div class="pnote">נתונים לדוגמה עד לחיבור לפריוריטי · <button class="reset-l" onclick="if(confirm('להחזיר את כל הקריאות למצב ההתחלתי? זה משפיע על כל מי שמחובר.'))resetAll()">איפוס הנתונים</button></div>
 <div class="foot">נבנה עבור צמרת מעליות · MeetingScheduled</div></div></div>`}

/* ========= TECHNICIAN ========= */
function techView(){
 if(!tab)tab='mine';
 const mine=calls().filter(c=>c.tech===me);
 const active=mine.filter(c=>['assigned','enroute','onsite'].includes(c.status)||(c.status==='scheduled'&&c.due<=dayStart(1)));
 const order={onsite:0,enroute:1,assigned:2,scheduled:3};
 active.sort((a,b)=>(order[a.status]-order[b.status])||((a.priority==='stopped'?0:1)-(b.priority==='stopped'?0:1))||(a.createdAt-b.createdAt));
 const later=mine.filter(c=>c.status==='scheduled'&&c.due>dayStart(1));
 const doneToday=mine.filter(c=>c.report&&c.report.at>=dayStart(0)&&['closed','needs_guy','scheduled','quote'].includes(c.status)&&c.report.by===me);
 let inner='';
 if(tab==='mine'){
  inner=`${pageHead('הקריאות שלי',DATE()+' · '+esc(PEOPLE[me].area))}${kpis([[active.filter(c=>c.priority==='stopped').length,'עומדות',1],[active.length,'לטיפול'],[doneToday.length,'דווחו היום']])}
  ${active.length?active.map(techCard).join(''):`<div class="empty">אין קריאות פתוחות כרגע. קריאה חדשה תופיע כאן מיד כשתשובץ אליך.</div>`}
  ${later.length?`<div class="section-t">מתוכנן בהמשך <span class="n">${later.length}</span></div>${later.map(techCard).join('')}`:''}`;
 }else{
  inner=`${pageHead('דווחו היום',DATE())}${doneToday.length?doneToday.map(c=>`<div class="card tap" onclick="openTechCall(${c.id})"><div class="row"><div class="addr">${esc(c.address)}</div>${statusPill(c)}</div><div class="detail">${esc(c.report.text)}</div><div class="meta"><span class="chip">${hhmm(c.report.at)}</span></div></div>`).join(''):`<div class="empty">עוד לא דיווחת היום.</div>`}`;
 }
 return shell(inner,[['mine','הקריאות שלי','list',active.length||''],['done','דווחו היום','check','']]);
}
function statusPill(c){const s=STATUS[c.status]||['',''];let t=s[0];if(c.status==='scheduled'&&c.due)t='המשך טיפול '+dayLabel(c.due);return `<span class="pill ${s[1]}">${t}</span>`}
function techCard(c){const m=memoOf(c);const repeat=(c.history||[]).length>=2;return `<div class="card tap ${c.priority==='stopped'?'stopped':''}" onclick="openTechCall(${c.id})">
 <div class="row"><span class="pill ${c.priority==='stopped'?'red':''}">${c.priority==='stopped'?'מעלית עומדת':'רגילה'}</span><span class="time">#${c.id} · ${hhmm(c.createdAt)}</span></div>
 <div class="addr mt">${esc(c.address)}</div><div class="issue">${esc(c.issue)}</div><div class="detail">${esc(c.detail)}</div>
 <div class="meta">${c.status!=='assigned'?statusPill(c):''}${repeat?`<span class="pill amber">קריאה ${(c.history.length+1)} החודש</span>`:''}${m&&!m.missing?`<span class="chip">תזכיר: ${m.defects.filter(d=>d.owner==='צמרת'&&!d.done).length} ליקויים פתוחים</span>`:''}</div></div>`}
let draft=null;
function openTechCall(id){const c=db.calls[id];openCall=id;const m=memoOf(c);const st=c.status;
 const canWork=['assigned','enroute','onsite','scheduled'].includes(st)&&c.tech===me;
 const repeat=(c.history||[]).length>=2;
 sheet(`<div><div class="row" style="justify-content:flex-start;gap:6px"><span class="pill ${c.priority==='stopped'?'red':''}">${c.priority==='stopped'?'מעלית עומדת':'רגילה'}</span>${statusPill(c)}</div><div class="addr" style="margin-top:6px">${esc(c.address)}</div><div class="sub">#${c.id} · ${esc(c.entrance)}</div></div>`,`
 <div class="box" style="margin-top:0"><div class="issue">${esc(c.issue)}</div><div class="detail" style="color:var(--ink)">${esc(c.detail)}</div>
  <div class="grid2 mt"><div class="kv"><span>איש קשר</span><b>${esc(c.contact)}</b></div><div class="kv"><span>סוג מעלית</span><b>${esc(c.elevator.type)}</b></div><div class="kv"><span>מס׳ במשרד העבודה</span><b>${esc(c.elevator.mol)}</b></div><div class="kv"><span>כיסוי</span><b>${COVER[c.cover]}</b></div></div>
  <div class="btns mt"><a class="btn ghost" href="https://waze.com/ul?q=${encodeURIComponent(c.address)}&navigate=yes" target="_blank" rel="noopener">${ICON.map} ניווט ב-Waze</a>${m?`<button class="btn ghost" onclick="openMemo('${m.id}',${c.id})">${ICON.doc} תזכיר אחרון</button>`:''}</div>
 </div>
 ${repeat?`<div class="warn"><b>קריאה חוזרת:</b> זו הקריאה ה-${c.history.length+1} בכתובת הזו בחודש האחרון, באותה תקלה.<div class="small mt">${c.history.map(h=>`${dayLabel(h.t)}: ${esc(h.repair)}`).join(' · ')}</div></div>`:''}
 ${m&&m.missing?`<div class="warn">התזכיר העדכני של המעלית הזו לא התקבל במשרד.</div>`:''}
 ${canWork&&st!=='onsite'?`<button class="btn primary block mt" style="min-height:52px;font-size:16px" onclick="techStep(${c.id},'${st==='enroute'?'onsite':'enroute'}')">${st==='enroute'?'הגעתי לאתר':'יצאתי לדרך'}</button>${st!=='enroute'?`<button class="btn block sm mt" style="background:none;color:var(--muted)" onclick="techStep(${c.id},'onsite')">כבר באתר</button>`:''}`:''}
 ${c.report?`<div class="ok"><b>הדיווח שלך (${hhmm(c.report.at)}):</b> ${esc(c.report.text)}</div>`:''}
 <div id="reportArea"></div>
 <div class="box"><h4>מה קרה בקריאה</h4><div class="log">${c.log.slice().reverse().map(l=>`<div><b>${hhmm(l.t)}</b><span>${esc(l.who)}: ${esc(l.text)}</span></div>`).join('')}</div></div>`);
 if(st==='onsite'&&c.tech===me)startReport(id,true);
}
function techStep(id,s){const c=db.calls[id];if(s==='enroute'&&!['assigned','scheduled'].includes(c.status))return;if(s==='onsite'&&!['assigned','scheduled','enroute'].includes(c.status))return;
 c.status=s;c.log.push({t:Date.now(),who:PEOPLE[me].name,text:s==='enroute'?'יצא לדרך':'הגיע לאתר'});put('calls',c);toast(s==='enroute'?'גיא והמשרד רואים שאתה בדרך':'סומן שהגעת. אפשר למלא דיווח');openTechCall(id)}
function startReport(id,silent){const c=db.calls[id];if(c.status!=='onsite')return;
 draft={id,outcome:'',reason:'',when:'',text:'',parts:{},photos:[],damage:false,defects:{}};renderReport();if(!silent)$('#reportArea')?.scrollIntoView({behavior:'smooth',block:'start'})}
function renderReport(){const c=db.calls[draft.id];const m=memoOf(c);const area=$('#reportArea');if(!area)return;
 const ch=(k,v,l)=>`<button class="choice ${draft[k]===v?'on':''}" onclick="draft.${k}='${v}';renderReport()">${l}</button>`;
 const sr=window.SpeechRecognition||window.webkitSpeechRecognition;
 area.innerHTML=`<div class="box"><h4>דיווח מהאתר</h4>
 <label class="f">מה המצב?</label><div class="choices">${ch('outcome','closed','המעלית תקינה, סוגר')}${ch('outcome','follow','צריך המשך טיפול')}</div>
 ${draft.outcome==='follow'?`<label class="f">מה צריך?</label><div class="choices">${REASONS.map(r=>ch('reason',r,r)).join('')}</div>
 <label class="f">מתי?</label><div class="choices">${WHEN.map(([k,l])=>ch('when',k,l)).join('')}</div>`:''}
 <label class="f">מה עשית</label><div class="mic"><textarea class="in" id="rtext" placeholder="${sr?'אפשר ללחוץ על המיקרופון ולהגיד':'אפשר להכתיב עם המיקרופון של המקלדת'}" oninput="draft.text=this.value">${esc(draft.text)}</textarea>${sr?`<button class="micbtn" id="micbtn" onclick="toggleMic()" aria-label="הכתבה">${ICON.mic}</button>`:''}</div>
 <label class="f">חלקים שהוחלפו או נדרשים</label>
 <div class="parts">${Object.entries(draft.parts).map(([pid,q])=>`<div class="part"><span>${esc(partById(pid).name)}</span><span class="qty"><button onclick="partQty('${pid}',-1)">−</button><b>${q}</b><button onclick="partQty('${pid}',1)">+</button></span></div>`).join('')}</div>
 <select class="in mt" onchange="if(this.value){partQty(this.value,1)}"><option value="">+ הוספת חלק מהמחירון</option>${PARTS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
 <label class="f">תמונות</label><div class="photos">${draft.photos.map((s,i)=>`<img src="${s}" alt="" onclick="draft.photos.splice(${i},1);renderReport()">`).join('')}${draft.photos.length<3?`<label class="addph">${ICON.cam}<input type="file" accept="image/*" capture="environment" hidden onchange="addPhoto(this)"></label>`:''}</div>
 ${m&&!m.missing&&m.defects.some(d=>d.owner==='צמרת'&&!d.done)?`<label class="f">ליקויים מהתזכיר שטופלו בביקור הזה</label><div class="box" style="margin-top:0">${m.defects.map((d,i)=>d.owner==='צמרת'&&!d.done?`<label class="def"><input type="checkbox" ${draft.defects[i]?'checked':''} onchange="draft.defects[${i}]=this.checked"><span>${esc(d.t)}</span></label>`:'').join('')}</div>`:''}
 <label class="def" style="border:0;margin-top:8px"><input type="checkbox" ${draft.damage?'checked':''} onchange="draft.damage=this.checked"><span>נמצאה חבלה או נזק מים</span></label>
 <button class="btn primary block mt" onclick="submitReport()" ${!draft.outcome||(draft.outcome==='follow'&&(!draft.reason||!draft.when))?'disabled':''}>${draft.outcome==='follow'?'שליחת הדיווח לגיא':draft.outcome==='closed'?'סגירת הקריאה':'בחרו מה המצב כדי לשלוח'}</button>
 ${draft.outcome==='follow'?'<div class="sub small mt">הדיווח מגיע ישר למסך של גיא, בלי וואטסאפ.</div>':draft.outcome==='closed'?'<div class="sub small mt">הקריאה נסגרת ועוברת לקריסטי. גיא לא צריך לאשר.</div>':''}</div>`;
}
function partQty(pid,d){draft.parts[pid]=(draft.parts[pid]||0)+d;if(draft.parts[pid]<=0)delete draft.parts[pid];renderReport()}
function addPhoto(inp){const f=inp.files[0];if(!f)return;const img=new Image();img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);draft.photos.push(cv.toDataURL('image/jpeg',.6));renderReport();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)}
let rec=null;
function toggleMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(rec){rec.stop();return}
 rec=new SR();rec.lang='he-IL';rec.interimResults=true;rec.continuous=true;const base=(draft.text?draft.text+' ':'');let finalT='';
 rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalT+=r[0].transcript+' ';else interim+=r[0].transcript}draft.text=(base+finalT+interim).trim();const ta=$('#rtext');if(ta)ta.value=draft.text};
 rec.onend=()=>{rec=null;$('#micbtn')?.classList.remove('rec')};rec.onerror=()=>{rec=null;$('#micbtn')?.classList.remove('rec');toast('ההכתבה לא זמינה כרגע. אפשר להשתמש במיקרופון של המקלדת')};
 rec.start();$('#micbtn')?.classList.add('rec')}
function submitReport(){if(rec)rec.stop();const c=db.calls[draft.id];const name=PEOPLE[me].name;const m=memoOf(c);
 if(!draft.text.trim()){toast('כתוב או הכתב בקצרה מה עשית');$('#rtext')?.focus();return}
 c.report={text:draft.text.trim(),outcome:draft.outcome,reason:draft.reason,when:draft.when,parts:Object.entries(draft.parts),damage:draft.damage,at:Date.now(),by:me};
 c.photos=draft.photos.slice();
 if(m&&Object.values(draft.defects).some(Boolean)){m.defects.forEach((d,i)=>{if(draft.defects[i]){d.done=true;d.doneBy=name;d.doneAt=Date.now()}});put('memos',m)}
 if(draft.outcome==='closed'){c.status='closed';c.log.push({t:Date.now(),who:name,text:'הקריאה נסגרה'})}
 else{c.status='needs_guy';c.log.push({t:Date.now(),who:name,text:'דיווח: '+draft.reason+' ('+WHEN.find(w=>w[0]===draft.when)[1]+')'})}
 put('calls',c);draft=null;closeSheet();toast(c.status==='closed'?'הקריאה נסגרה ועברה למשרד':'הדיווח נשלח לגיא')}
function openMemo(mid,callId){const m=db.memos[mid];sheet(`<div><div class="sub">תזכיר בודק · משרד העבודה</div><div class="addr">${esc(m.address)}</div></div>`,
 m.missing?`<div class="danger"><b>התזכיר לא התקבל.</b> מועד הבדיקה הבא היה ${new Date(m.next).toLocaleDateString('he-IL')}. המשרד קיבל התראה.</div>`:
 `<div class="memo-id"><div class="kv"><span>יצרן</span><b>${esc(m.maker)}</b></div><div class="kv"><span>שנת התקנה</span><b>${m.year}</b></div><div class="kv"><span>תחנות</span><b>${m.stops}</b></div><div class="kv"><span>עומס</span><b>${esc(m.load)}</b></div><div class="kv"><span>בדיקה אחרונה</span><b>${new Date(m.last).toLocaleDateString('he-IL')}</b></div><div class="kv"><span>בדיקה הבאה</span><b>${new Date(m.next).toLocaleDateString('he-IL')}</b></div></div>

 <label class="f">כתובת</label><input class="in" id="nAddr" placeholder="רחוב ומספר"><label class="f">עיר</label><select class="in" id="nCity">${Object.keys(CITY_TECH).map(c=>`<option>${c}</option>`).join('')}</select>
 <label class="f">כניסה</label><input class="in" id="nEnt" placeholder="למשל: כניסה ב׳ מהחניה"><label class="f">מי מדבר</label><input class="in" id="nContact" placeholder="שם איש הקשר">
 <label class="f">מצב המעלית</label><div class="choices" id="nPri"><button class="choice on" data-k="normal" onclick="pick(this)">פועלת</button><button class="choice" data-k="stopped" onclick="pick(this)">עומדת</button></div>
 <label class="f">התקלה</label><input class="in" id="nIssue" placeholder="למשל: דלת לא נסגרת"><label class="f">פירוט</label><textarea class="in" id="nDetail" placeholder="קומה, דלתות פתוחות או סגורות, חשמל, תאורה בלחצנים, יש לכודים?"></textarea>
 <label class="f">כיסוי</label><div class="choices" id="nCover">${Object.entries(COVER).map(([k,l],i)=>`<button class="choice ${i?'':'on'}" data-k="${k}" onclick="pick(this)">${l}</button>`).join('')}</div>
 <button class="btn primary block mt" onclick="createCall()">פתיחה ושיבוץ לפי האזור</button>`)}
function pick(b){[...b.parentNode.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function createCall(){const addr=$('#nAddr').value.trim(),issue=$('#nIssue').value.trim();if(!addr||!issue){toast('חסרים כתובת ותקלה');return}
 const meta=db.meta.seed;const id=meta.nextId++;put('meta',meta);const city=$('#nCity').value;const t=CITY_TECH[city];
 const c={id,address:addr+', '+city,entrance:$('#nEnt').value||'כניסה ראשית',city,issue,detail:$('#nDetail').value||'',priority:$('#nPri .on').dataset.k,status:'assigned',tech:t,cover:$('#nCover .on').dataset.k,contact:$('#nContact').value||'—',elevator:{type:'חשמלית',mol:'—',contract:'—'},createdAt:Date.now(),history:[],photos:[],report:null,internal:'',
  log:[{t:Date.now(),who:PEOPLE[me].name,text:'קריאה נפתחה'},{t:Date.now(),who:'מערכת',text:'שובצה ל'+PEOPLE[t].name+' לפי האזור'}]};
 put('calls',c);closeSheet();toast('הקריאה שובצה ל'+PEOPLE[t].name)}

/* ========= render ========= */
function render(){const keep=openCall;let html;
 if(!me||!PEOPLE[me])html=picker();else{const r=PEOPLE[me].role;html=r==='tech'||r==='team'?techView():r==='guy'?guyView():officeView()}
 $('#app').innerHTML=html;renderSync();
 if(keep&&$('#sheet')&&!draft){/* sheet content refresh handled by explicit calls */}
}
(async()=>{$('#app').innerHTML='<div class="pick"><div class="sub">טוען…</div></div>';await initStore();render();setInterval(poll,2500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()})})();
</script>
</body>
</html>
